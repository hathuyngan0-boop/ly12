<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vật Lý 12 · Chương 2: Khí Lí Tưởng (266 Câu · 14 Mục)</title>
<meta name="description" content="Vật Lý 12 · Chương 2 Khí Lí Tưởng: mô hình 3D tương tác (hộp khí, Boyle, Charles), 266 câu 3 dạng đề, thi thử bấm giờ 50 phút, ôn câu sai, bảng công thức." />
<meta name="theme-color" content="#f6f4ee" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-ivory: #f6f4ee;
  --surface-chalk: #ffffff;
  --surface-subtle: #efece3;
  --ink-obsidian: #141820;
  --ink-muted: #525b6c;
  --ink-faint: #7c8596;
  --cobalt: #1d4ed8;
  --cobalt-soft: rgba(29, 78, 216, 0.10);
  --cobalt-mid: rgba(29, 78, 216, 0.24);
  --amber: #d97706;
  --amber-soft: rgba(217, 119, 6, 0.12);
  --emerald: #059669;
  --emerald-soft: rgba(5, 150, 105, 0.11);
  --crimson: #dc2626;
  --crimson-soft: rgba(220, 38, 38, 0.11);
  --line-hair: rgba(20, 24, 32, 0.12);
  --line-strong: rgba(20, 24, 32, 0.24);
  --shadow-subtle: 0 2px 10px rgba(20, 24, 32, 0.04);
  --canvas-bg: #eef2f8;
  --canvas-line: rgba(29, 78, 216, 0.11);
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
  --radius-sm: 6px;
  --radius-md: 10px;
}

html[data-theme="dark"] {
  --bg-ivory: #0c1017;
  --surface-chalk: #121823;
  --surface-subtle: #182030;
  --ink-obsidian: #eef2f8;
  --ink-muted: #9aa5b8;
  --ink-faint: #6c778b;
  --cobalt: #60a5fa;
  --cobalt-soft: rgba(96, 165, 250, 0.14);
  --cobalt-mid: rgba(96, 165, 250, 0.32);
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.15);
  --emerald: #34d399;
  --emerald-soft: rgba(52, 211, 153, 0.14);
  --crimson: #f87171;
  --crimson-soft: rgba(248, 113, 113, 0.14);
  --line-hair: rgba(238, 242, 248, 0.12);
  --line-strong: rgba(238, 242, 248, 0.25);
  --shadow-subtle: 0 6px 24px rgba(0, 0, 0, 0.35);
  --canvas-bg: #080c12;
  --canvas-line: rgba(96, 165, 250, 0.14);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background-color: var(--bg-ivory);
  color: var(--ink-obsidian);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  transition: background-color 0.25s ease, color 0.25s ease;
}

button, input {
  font-family: inherit;
  color: inherit;
}

/* Subtle Field Ambient Canvas */
#ambientFieldCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.72;
}

/* Shell & Top Instrument Bar */
.obs-shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.obs-topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: 58px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--bg-ivory) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-hair);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-reticle {
  width: 30px;
  height: 30px;
  border: 1px solid var(--cobalt);
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  color: var(--cobalt);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}

.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15.5px;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
  white-space: nowrap;
}

.mode-tabs {
  display: inline-flex;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-chalk);
  padding: 3px;
  gap: 3px;
}

.mode-tab {
  border: none;
  background: transparent;
  padding: 5px 13px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-muted);
  cursor: pointer;
  transition: background-color 0.2s var(--spring), color 0.2s ease, transform 0.15s ease;
  white-space: nowrap;
}

.mode-tab:hover { color: var(--ink-obsidian); }
.mode-tab.active {
  background: var(--cobalt);
  color: #ffffff;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.inst-btn {
  height: 34px;
  padding: 0 11px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-chalk);
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.15s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .inst-btn:hover {
    border-color: var(--cobalt);
    color: var(--cobalt);
  }
}

.inst-btn:active { transform: scale(0.97); }
.inst-btn.is-amber { border-color: rgba(217, 119, 6, 0.45); color: var(--amber); }
.lbl-short { display: none; }

.kbd-chip {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 1px 5px;
  border: 1px solid var(--line-hair);
  border-radius: 3px;
  color: var(--ink-muted);
}

/* Main Container & Section Eyebrow */
.main-container {
  flex: 1;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
}

.rail-section-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 8px;
}

/* Topic Lobby & Auto-Save History */
.lobby-wrap {
  padding: 24px 24px 56px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.lobby-hero {
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  padding: 20px 22px;
  box-shadow: var(--shadow-subtle);
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.lobby-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.stat-card {
  padding: 10px 12px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-subtle);
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 19px;
  font-weight: 700;
  color: var(--ink-obsidian);
}

.stat-lbl {
  font-size: 11.5px;
  color: var(--ink-muted);
}

.resume-banner {
  padding: 12px 14px;
  border: 1px solid var(--cobalt);
  border-radius: var(--radius-sm);
  background: var(--cobalt-soft);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.resume-banner.is-exam {
  border-color: var(--amber);
  background: var(--amber-soft);
}

.lobby-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.lf-pill {
  padding: 6px 13px;
  border: 1px solid var(--line-hair);
  border-radius: 999px;
  background: var(--surface-chalk);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.16s ease;
}

.lf-pill.active {
  background: var(--cobalt);
  border-color: var(--cobalt);
  color: #ffffff;
}

.lobby-accordion-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.lobby-section {
  display: flex;
  flex-direction: column;
}

.lobby-sec-toggle {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  box-shadow: var(--shadow-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.18s ease, background-color 0.18s ease;
}

@media (hover: hover) and (pointer: fine) {
  .lobby-sec-toggle:hover {
    border-color: var(--cobalt);
  }
}

.lobby-section.open .lobby-sec-toggle {
  border-color: color-mix(in srgb, var(--cobalt) 55%, var(--line-hair));
}

.sec-toggle-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}

.sec-toggle-title {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-obsidian);
}

.sec-chevron-pill {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: 1px solid var(--line-hair);
  background: var(--surface-subtle);
  color: var(--cobalt);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.24s var(--spring), background-color 0.18s ease, border-color 0.18s ease;
}

.lobby-section.open .sec-chevron-pill {
  transform: rotate(180deg);
  background: var(--cobalt-soft);
  border-color: var(--cobalt);
}

.lobby-sec-toggle .topic-badge {
  flex-shrink: 0;
  white-space: nowrap;
}

.lobby-sec-body {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows 0.24s var(--spring), opacity 0.18s ease, margin-top 0.2s ease;
}

.lobby-section.open .lobby-sec-body {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-top: 10px;
}

.lobby-sec-inner {
  min-height: 0;
  overflow: hidden;
  visibility: hidden;
}

.lobby-section.open .lobby-sec-inner {
  visibility: visible;
  padding: 2px 0;
}

.lobby-sec-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
  gap: 12px;
}

.topic-card {
  position: relative;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  box-shadow: var(--shadow-subtle);
  transition: border-color 0.18s ease, transform 0.18s var(--spring), box-shadow 0.18s ease;
}

@media (hover: hover) and (pointer: fine) {
  .topic-card:hover {
    border-color: var(--cobalt);
    transform: translateY(-2px);
  }
}

.topic-card.in-prog { border-left: 3px solid var(--cobalt); }
.topic-card.is-done { border-left: 3px solid var(--emerald); }
.topic-card.is-exam { border-left: 3px solid var(--amber); }

.topic-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
}

.topic-badge {
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 10.5px;
}

.badge-idle { background: var(--surface-subtle); color: var(--ink-muted); }
.badge-prog { background: var(--cobalt-soft); color: var(--cobalt); }
.badge-done { background: var(--emerald-soft); color: var(--emerald); }
.badge-calc { background: var(--amber-soft); color: var(--amber); }

.topic-title {
  font-family: var(--font-display);
  font-size: 15.5px;
  font-weight: 700;
  color: var(--ink-obsidian);
  line-height: 1.3;
}

.topic-blurb {
  font-size: 12.5px;
  color: var(--ink-muted);
  line-height: 1.45;
}

.topic-prog-track {
  height: 5px;
  border-radius: 99px;
  background: var(--surface-subtle);
  overflow: hidden;
  margin-top: 2px;
}

.topic-prog-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--cobalt);
  transition: width 0.25s ease;
}

.topic-card.is-done .topic-prog-fill { background: var(--emerald); }

.topic-card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: auto;
  padding-top: 4px;
}

.topic-reset-mini {
  padding: 2px 8px;
  border: 1px solid var(--line-hair);
  border-radius: 4px;
  background: var(--surface-subtle);
  font-size: 11px;
  color: var(--ink-muted);
  cursor: pointer;
}

.history-panel {
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-subtle);
  font-size: 13px;
}

/* Central Observatory Stage */
.observatory-stage {
  padding: 24px 32px 48px;
  min-width: 0;
}

.stage-view {
  animation: stageEnter 0.34s var(--spring) both;
}

@keyframes stageEnter {
  from {
    opacity: 0;
    clip-path: inset(0 0 6% 0);
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    transform: translateY(0);
  }
}

.stage-header-band {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line-hair);
  margin-bottom: 22px;
}

.stage-eyebrow {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--cobalt);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stage-h1 {
  font-family: var(--font-display);
  font-size: clamp(24px, 2.8vw, 34px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-top: 4px;
}

.stage-lead {
  color: var(--ink-muted);
  font-size: 14px;
  margin-top: 6px;
  max-width: 640px;
}

/* 3D Physics Discovery Lab */
.discovery-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(290px, 0.95fr);
  gap: 20px;
  align-items: start;
}

.scope-viewport {
  position: relative;
  height: 490px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: radial-gradient(circle at 50% 42%, var(--surface-chalk), var(--canvas-bg));
  overflow: hidden;
  box-shadow: var(--shadow-subtle);
}

#physics3dCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}

#physics3dCanvas:active { cursor: grabbing; }

.scope-hud-top {
  position: absolute;
  top: 12px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  z-index: 3;
}

.scope-badge {
  pointer-events: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 9px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface-chalk) 86%, transparent);
  backdrop-filter: blur(6px);
  color: var(--ink-obsidian);
}

.scope-hud-bot {
  position: absolute;
  bottom: 12px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  pointer-events: none;
  z-index: 3;
}

.scope-hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
  background: color-mix(in srgb, var(--surface-chalk) 84%, transparent);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--line-hair);
}

.model-pill-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.model-tab-btn {
  padding: 7px 12px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-chalk);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.18s var(--spring);
}

@media (hover: hover) and (pointer: fine) {
  .model-tab-btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
}
.model-tab-btn.active {
  background: var(--cobalt);
  border-color: var(--cobalt);
  color: #ffffff;
}

.inspector-panel {
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel-heading {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
}

.panel-equation {
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 8px 10px;
  background: var(--surface-subtle);
  border-left: 3px solid var(--amber);
  border-radius: 0 4px 4px 0;
  color: var(--ink-obsidian);
}

.slider-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.slider-meta {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  font-weight: 600;
}

.slider-val {
  font-family: var(--font-mono);
  color: var(--cobalt);
}

input[type="range"].phys-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--line-strong);
  outline: none;
  cursor: pointer;
}

input[type="range"].phys-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--cobalt);
  border: 2px solid var(--surface-chalk);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  transition: transform 0.15s ease;
}

input[type="range"].phys-slider::-webkit-slider-thumb:hover { transform: scale(1.16); }

.readout-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--line-hair);
}

.readout-cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.readout-k {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
}

.readout-v {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-obsidian);
}

/* Quiz & Exam Arena */
.arena-toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.segmented-control {
  display: inline-flex;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-chalk);
  padding: 3px;
  gap: 3px;
}

.seg-item {
  border: none;
  background: transparent;
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.18s ease;
}

.seg-item.active {
  background: var(--ink-obsidian);
  color: var(--surface-chalk);
}

.exam-timer-badge {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  padding: 5px 11px;
  border: 1px solid var(--amber);
  border-radius: var(--radius-sm);
  background: var(--amber-soft);
  color: var(--amber);
}

.arena-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 232px;
  gap: 24px;
  align-items: start;
}

.arena-sheet {
  position: relative;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  padding: 24px;
  box-shadow: var(--shadow-subtle);
  overflow: hidden;
}

.osc-progress-svg {
  display: block;
  width: 100%;
  height: 16px;
  margin-bottom: 16px;
}

.q-meta-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.q-index-tag {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--cobalt);
  background: var(--cobalt-soft);
  padding: 3px 9px;
  border-radius: 4px;
}

.q-type-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
  border: 1px solid var(--line-hair);
  padding: 2px 8px;
  border-radius: 4px;
}

.q-stem {
  font-size: 16.5px;
  font-weight: 600;
  line-height: 1.55;
  color: var(--ink-obsidian);
  margin-bottom: 18px;
}

.q-diagram-box {
  margin-bottom: 18px;
  padding: 12px 14px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--bg-ivory);
}

.q-diagram-box svg path,
.q-diagram-box svg line,
.q-diagram-box svg circle {
  stroke-dasharray: 280;
  stroke-dashoffset: 0;
  animation: svgTrace 0.85s var(--spring) both;
}

@keyframes svgTrace {
  from { stroke-dashoffset: 280; }
  to { stroke-dashoffset: 0; }
}

.options-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt-btn {
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-chalk);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  font-size: 14.5px;
  transition: transform 0.16s var(--spring), border-color 0.18s ease, background-color 0.18s ease;
}

@media (hover: hover) and (pointer: fine) {
  .opt-btn:hover {
    border-color: var(--cobalt);
    background: var(--cobalt-soft);
    transform: translateX(3px);
  }
}

.opt-btn:active { transform: scale(0.99); }

.opt-key {
  width: 26px;
  height: 26px;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.opt-btn.selected {
  border-color: var(--cobalt);
  background: var(--cobalt-soft);
}
.opt-btn.selected .opt-key {
  background: var(--cobalt);
  border-color: var(--cobalt);
  color: #ffffff;
}

.opt-btn.correct {
  border-color: var(--emerald);
  background: var(--emerald-soft);
}
.opt-btn.correct .opt-key {
  background: var(--emerald);
  border-color: var(--emerald);
  color: #ffffff;
}

.opt-btn.wrong {
  border-color: var(--crimson);
  background: var(--crimson-soft);
}
.opt-btn.wrong .opt-key {
  background: var(--crimson);
  border-color: var(--crimson);
  color: #ffffff;
}

/* True/False Table Rows */
.tf-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line-hair);
}

.tf-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 6px;
  border-bottom: 1px solid var(--line-hair);
}

.tf-text { font-size: 14.5px; line-height: 1.5; }

.tf-actions {
  display: inline-flex;
  gap: 6px;
}

.tf-toggle {
  padding: 5px 12px;
  border: 1px solid var(--line-hair);
  border-radius: 4px;
  background: var(--surface-chalk);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.tf-toggle.active {
  background: var(--cobalt);
  border-color: var(--cobalt);
  color: #ffffff;
}
.tf-row.row-ok .tf-toggle.active { background: var(--emerald); border-color: var(--emerald); }
.tf-row.row-err .tf-toggle.active { background: var(--crimson); border-color: var(--crimson); }

/* Short Answer Numeric */
.short-input-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.short-input {
  width: 220px;
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-ivory);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
  outline: none;
  transition: border-color 0.18s ease;
}

.short-input:focus { border-color: var(--cobalt); }
.short-input.is-ok { border-color: var(--emerald); background: var(--emerald-soft); }
.short-input.is-err { border-color: var(--crimson); background: var(--crimson-soft); }

.primary-btn {
  height: 38px;
  padding: 0 16px;
  border: 1px solid var(--cobalt);
  border-radius: var(--radius-sm);
  background: var(--cobalt);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.15s var(--spring), opacity 0.18s ease;
}
.primary-btn:hover { opacity: 0.92; }
.primary-btn:active { transform: scale(0.97); }

/* Solution Box */
.solution-box {
  margin-top: 18px;
  padding: 14px 16px;
  border-left: 3px solid var(--cobalt);
  border-top: 1px solid var(--line-hair);
  background: var(--surface-subtle);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 14px;
  line-height: 1.6;
  animation: stageEnter 0.25s var(--spring) both;
}

.solution-box.is-right { border-left-color: var(--emerald); }
.solution-box.is-wrong { border-left-color: var(--crimson); }

.sol-steps { display: flex; flex-direction: column; gap: 6px; }
.sol-step { display: block; line-height: 1.55; }
.q-summary-box {
  margin-bottom: 14px;
  padding: 10px 14px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-subtle);
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-muted);
}
.q-summary-box strong { color: var(--cobalt); display: block; margin-bottom: 3px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }

.solution-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
}

.arena-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--line-hair);
}

/* Navigator Sidebar */
.nav-panel {
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-md);
  background: var(--surface-chalk);
  padding: 16px;
}

.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}

.nav-dot {
  height: 32px;
  border: 1px solid var(--line-hair);
  border-radius: 4px;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s ease;
}

@media (hover: hover) and (pointer: fine) {
  .nav-dot:hover { border-color: var(--cobalt); }
}
.nav-dot.current { outline: 2px solid var(--cobalt); outline-offset: 1px; }
.nav-dot.done { background: var(--cobalt-soft); border-color: var(--cobalt); color: var(--cobalt); }
.nav-dot.right { background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald); }
.nav-dot.wrong { background: var(--crimson-soft); border-color: var(--crimson); color: var(--crimson); }

/* Formula & SI Constants Drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(12, 16, 23, 0.45);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: flex-end;
}

.drawer-backdrop.open { display: flex; }

.formula-drawer {
  width: min(460px, 100vw);
  height: 100%;
  background: var(--surface-chalk);
  border-left: 1px solid var(--line-hair);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  animation: slideLeft 0.24s var(--spring) both;
}

@keyframes slideLeft {
  from { transform: translateX(30px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-search {
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-ivory);
  font-size: 13.5px;
  outline: none;
}

.drawer-search:focus { border-color: var(--cobalt); }

.formula-entry {
  border-top: 1px solid var(--line-hair);
  padding: 10px 0;
}

.formula-name { font-size: 13.5px; font-weight: 700; }
.formula-eq {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--cobalt);
  margin: 4px 0;
}
.formula-note { font-size: 12.5px; color: var(--ink-muted); }

.exam-summary-banner {
  border: 1px solid var(--cobalt);
  background: var(--cobalt-soft);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin-bottom: 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

/* ===== Upgrade layer: motion, spotlight, beam, result ring ===== */
@property --beam-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes beamSpin { to { --beam-angle: 360deg; } }
@keyframes optIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@keyframes shakeX { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes okPulse { from { box-shadow: 0 0 0 0 var(--emerald-soft), 0 0 0 0 var(--emerald); } to { box-shadow: 0 0 0 14px transparent, 0 0 0 0 transparent; } }
@keyframes titleSheen { to { background-position: -200% 0; } }

.stage-view.static { animation: none; }
.stage-h1 {
  background: linear-gradient(110deg, var(--ink-obsidian) 38%, var(--cobalt) 50%, var(--ink-obsidian) 62%) 0 0 / 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleSheen 7s linear infinite;
}
.stage-view:not(.static) .opt-btn { animation: optIn 0.38s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
.opt-btn.wrong { animation: shakeX 0.42s var(--spring); }
.opt-btn.correct { animation: okPulse 0.9s ease-out; }

.arena-sheet::before, .inspector-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(360px circle at var(--mx, -400px) var(--my, -400px), var(--cobalt-soft), transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.arena-sheet:hover::before, .inspector-panel:hover::before { opacity: 1; }
.inspector-panel { position: relative; }
.arena-sheet.exam-live::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: conic-gradient(from var(--beam-angle), transparent 72%, var(--cobalt) 88%, var(--amber) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  animation: beamSpin 5s linear infinite;
}
.exam-timer-badge.is-low { color: var(--crimson); border-color: var(--crimson); animation: okPulse 1s ease-in-out infinite; }

.result-ring { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
.result-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.result-ring circle { fill: none; stroke-width: 8; }
.ring-track { stroke: var(--line-hair); }
.ring-fill { stroke-linecap: round; stroke-dasharray: 289; animation: ringDraw 1.2s var(--spring) backwards; }
@keyframes ringDraw { from { stroke-dashoffset: 289; } }
.result-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; }
.summary-meta { display: flex; align-items: center; gap: 16px; }
.summary-stats { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); line-height: 1.7; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
button { touch-action: manipulation; }

/* Sticky Back Bar, Completion Banner, Bottom-Right FAB & Root Mobile Map Sheet */
.quiz-back-bar {
  position: sticky;
  top: 58px;
  z-index: 36;
  background: color-mix(in srgb, var(--surface-chalk) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-hair);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.back-lobby-btn {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-chalk);
  font-weight: 700;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}

.quiz-bar-title {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mob-map-btn { display: none; }

.topic-done-banner {
  margin-top: 16px;
  padding: 15px 16px;
  border: 1px solid var(--emerald);
  border-radius: var(--radius-md);
  background: var(--emerald-soft);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.mob-next-fab-wrap,
.mob-map-backdrop,
.mob-map-sheet {
  display: none;
}

/* Centered Completion & Score Modal */
.score-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 108;
  background: rgba(12, 16, 23, 0.64);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
}

.score-modal-backdrop.open {
  display: grid;
}

.score-modal-card {
  width: 100%;
  max-width: 460px;
  background: var(--surface-chalk);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-elevated);
  padding: 22px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
  animation: dockPop 0.26s var(--spring);
}

.score-modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-hair);
}

.score-hero-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}

.score-big-num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--ink-obsidian);
  line-height: 1.15;
}

.score-verdict-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
}

.score-stat-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.score-stat-box {
  padding: 10px 8px;
  border: 1px solid var(--line-hair);
  border-radius: var(--radius-sm);
  background: var(--surface-subtle);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.score-stat-val {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 700;
}

.score-stat-lbl {
  font-size: 11px;
  color: var(--ink-muted);
}

.score-modal-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.score-modal-actions .primary-btn,
.score-modal-actions .inst-btn {
  width: 100%;
  height: 44px;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}

@keyframes dockPop {
  0% { transform: scale(0.92); opacity: 0.7; }
  65% { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.mob-next-fab {
  height: 48px;
  padding: 0 18px;
  border-radius: 999px;
  border: none;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  background: var(--cobalt);
  box-shadow: 0 8px 24px rgba(29, 78, 216, 0.40);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  white-space: nowrap;
  max-width: calc(100vw - 28px);
  overflow: hidden;
  text-overflow: ellipsis;
  animation: dockPop 0.25s var(--spring);
}

.mob-next-fab:active { transform: scale(0.96); }
.mob-next-fab.is-right { background: var(--emerald); box-shadow: 0 8px 24px rgba(5, 150, 105, 0.40); }
.mob-next-fab.is-check { background: var(--amber); box-shadow: 0 8px 24px rgba(217, 119, 6, 0.40); }

.mob-sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-bottom: 10px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--line-hair);
  position: sticky;
  top: -14px;
  padding-top: 4px;
  background: var(--surface-chalk);
  z-index: 2;
}

/* Responsive Breakpoints */
@media (max-width: 980px) {
  .mob-map-btn { display: inline-flex; height: 34px; padding: 0 10px; font-family: var(--font-mono); font-size: 12px; }
  .observatory-stage { min-width: 0; max-width: 100%; padding: 14px 14px calc(86px + env(safe-area-inset-bottom, 0px)); }
  .discovery-grid, .arena-layout { grid-template-columns: minmax(0, 1fr); }
  .scope-viewport { height: 340px; }
  .nav-panel { display: none; }
  .footer-kbd-hint { display: none; }
  .mob-next-fab-wrap {
    position: fixed;
    right: 14px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 88;
    transition: transform 0.2s var(--spring), opacity 0.18s ease;
  }
  .mob-next-fab-wrap.visible { display: block; }
  body.kbd-open .mob-next-fab-wrap {
    transform: translateY(140%);
    opacity: 0;
    pointer-events: none;
  }
  .mob-map-backdrop {
    position: fixed;
    inset: 0;
    z-index: 92;
    background: rgba(12, 16, 23, 0.54);
    backdrop-filter: blur(3px);
  }
  .mob-map-backdrop.open { display: block; }
  .mob-map-sheet {
    display: block;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 96;
    max-height: 80dvh;
    overflow-y: auto;
    background: var(--surface-chalk);
    border-top: 1px solid var(--line-strong);
    border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.28);
    transform: translateY(106%);
    transition: transform 0.28s var(--spring);
    pointer-events: none;
  }
  .mob-map-sheet.open { transform: translateY(0); pointer-events: auto; }
  .mob-map-sheet .nav-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
  .mob-map-sheet .nav-dot { height: 38px; font-size: 12.5px; }
}

@media (max-width: 640px) {
  .obs-topbar { position: relative; top: auto; height: auto; padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
  .quiz-back-bar { top: 0; padding: 8px 10px; z-index: 42; }
  .mode-tabs { order: 3; width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .mode-tab { text-align: center; padding: 7px 6px; }
  .top-actions { gap: 5px; }

const AudioBench = (() => {
  let ctx = null;
  let enabled = true;
  function getCtx() {
    if (!ctx && typeof window !== 'undefined') {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) ctx = new Ctor();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function ping(freq, dur, vol = 0.08, type = 'sine') {
    if (!enabled) return;
    const c = getCtx();
    if (!c) return;
    try {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.connect(g);
      g.connect(c.destination);
      o.start();
      o.stop(c.currentTime + dur + 0.01);
    } catch (_) {}
  }
  return {
    toggle() {
      enabled = !enabled;
      const btn = document.getElementById('audioToggleBtn');
      if (btn) btn.textContent = `Âm thanh: ${enabled ? 'Bật' : 'Tắt'}`;
      if (enabled) ping(528, 0.09, 0.06);
    },
    click() { ping(280, 0.04, 0.05, 'triangle'); },
    correct() { ping(587.3, 0.14, 0.07); setTimeout(() => ping(880, 0.22, 0.07), 55); },
    wrong() { ping(195, 0.16, 0.06, 'sawtooth'); }
  };
})();

(function initAmbientField() {
  const canvas = document.getElementById('ambientFieldCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, dpr = 1, raf = 0, t = 0, lineColor = 'rgba(29,78,216,0.11)';
  const ptr = { x: 0.5, y: 0.4, tx: 0.5, ty: 0.4 };
  const syncColor = () => { lineColor = getComputedStyle(document.documentElement).getPropertyValue('--canvas-line').trim() || lineColor; };
  syncColor();
  new MutationObserver(syncColor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('pointermove', e => {
    if (w > 0 && h > 0) {
      ptr.tx = e.clientX / w;
      ptr.ty = e.clientY / h;
    }
  }, { passive: true });

  function drawFrame() {
    ctx.clearRect(0, 0, w, h);
    ptr.x += (ptr.tx - ptr.x) * 0.06;
    ptr.y += (ptr.ty - ptr.y) * 0.06;

    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1;

    const cx = ptr.x * w;
    const cy = ptr.y * h;
    const rows = 9;
    const step = h / (rows + 1);
    for (let i = 1; i <= rows; i++) {
      const y0 = i * step;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 28) {
        const dx = x - cx;
        const dy = y0 - cy;
        const dist = Math.hypot(dx, dy) + 90;
        const wave = Math.sin(x * 0.008 + t + i * 0.6) * 6 + (dy / dist) * (1400 / dist);
        const py = y0 + wave;
        if (x === 0) ctx.moveTo(x, py);
        else ctx.lineTo(x, py);
      }
      ctx.stroke();
    }
  }

  function loop() {
    if (!document.hidden && !reduceMotion) {
      t += 0.015;
      drawFrame();
    }
    raf = requestAnimationFrame(loop);
  }
  drawFrame();
  if (!reduceMotion) raf = requestAnimationFrame(loop);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    } else if (!document.hidden && !reduceMotion && !raf) {
      raf = requestAnimationFrame(loop);
    }
  });
})();

const PhysicsThreeEngine = (() => {
  let stateRef = {
    modelKey: 'gas_box',
    params: {
      tempK: 300, boxSize: 3.0, molCount: 24,
      volBoyle: 2.0, tempBoyle: 300,
      tempCharles: 300, pressAtm: 1.0
    }
  };

  let renderer = null, scene = null, camera = null, group = null;
  let rafId = 0, isVisible = true, inViewport = true, canvasEl = null, resizeObs = null, interObs = null;
  let useWebGL = false, ctx2d = null;
  let simTime = 0, lastFrame = performance.now(), slowFrames = 0;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cam = {
    theta: 0.65, phi: 1.08, radius: 7.4,
    tTheta: 0.65, tPhi: 1.08, tRadius: 7.4,
    dragging: false, lastX: 0, lastY: 0, idleSince: 0
  };

  let particles = [];
  let dynamicRefs = {};

  function disposeGroup() {
    if (!group) return;
    group.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => m.dispose());
      }
    });
    scene.remove(group);
    group = null;
  }

  function spawnParticles(count, halfX, halfY, halfZ) {
    const mats = [
      new THREE.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x1d4ed8, emissiveIntensity: 0.28, roughness: 0.25 }),
      new THREE.MeshStandardMaterial({ color: 0xd97706, emissive: 0xd97706, emissiveIntensity: 0.25, roughness: 0.25 })
    ];
    const geo = new THREE.SphereGeometry(0.11, 14, 14);
    const list = [];
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(geo, mats[i % 2]);
      m.position.set((Math.random() * 2 - 1) * (halfX - 0.2), (Math.random() * 2 - 1) * (halfY - 0.2), (Math.random() * 2 - 1) * (halfZ - 0.2));
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      list.push({ mesh: m, vx: Math.sin(ph) * Math.cos(th), vy: Math.sin(ph) * Math.sin(th), vz: Math.cos(ph) });
      group.add(m);
    }
    return list;
  }

  function buildApparatus(key) {
    if (!useWebGL || !scene) return;
    disposeGroup();
    group = new THREE.Group();
    dynamicRefs = {};
    particles = [];

    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.16, roughness: 0.1, metalness: 0.05 });
    const copperMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.72, roughness: 0.28 });
    const aluMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.75, roughness: 0.25 });

    if (key === 'gas_box') {
      cam.tTheta = 0.65; cam.tPhi = 1.05; cam.tRadius = 7.4;
      const s = stateRef.params.boxSize;
      const boxGeo = new THREE.BoxGeometry(s, s, s);
      const wire = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0x1d4ed8 }));
      const shell = new THREE.Mesh(boxGeo, glassMat);
      group.add(wire, shell);
      particles = spawnParticles(stateRef.params.molCount, s * 0.5, s * 0.5, s * 0.5);
      dynamicRefs = { wire, shell };
    } else {
      cam.tTheta = 0.6; cam.tPhi = 1.08; cam.tRadius = 7.6;
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 3.8, 32, 1, true), glassMat);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.42, 1.42, 0.2, 32), aluMat);
      base.position.y = -2.0;
      const piston = new THREE.Mesh(new THREE.CylinderGeometry(1.32, 1.32, 0.28, 32), copperMat);
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.2, 16), aluMat);
      rod.position.y = 1.15;
      piston.add(rod);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.38, 0.04, 12, 48), new THREE.MeshStandardMaterial({ color: 0x1d4ed8 }));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.9;
      group.add(cyl, base, piston, ring);
      particles = spawnParticles(22, 0.9, 1.2, 0.9);
      dynamicRefs = { piston };
    }
    scene.add(group);
  }

  function updateWebGLFrame(dt) {
    const p = stateRef.params;
    const key = stateRef.modelKey;
    simTime += dt;

    let halfX = 1.5, minY = -1.5, maxY = 1.5, halfZ = 1.5, speed = 1.8;
    if (key === 'gas_box') {
      const s = p.boxSize;
      halfX = halfZ = s * 0.5;
      minY = -s * 0.5; maxY = s * 0.5;
      speed = 1.2 * Math.sqrt(p.tempK / 300) * 2.1;
    } else if (key === 'boyle_piston' && dynamicRefs.piston) {
      const hFrac = p.volBoyle / 4.0;
      const pistY = -1.8 + hFrac * 3.4;
      dynamicRefs.piston.position.y = pistY;
      halfX = halfZ = 0.92;
      minY = -1.8; maxY = pistY - 0.16;
      speed = 1.8 * Math.sqrt(p.tempBoyle / 300);
    } else if (key === 'charles_cyl' && dynamicRefs.piston) {
      const hFrac = Math.min(1.0, (p.tempCharles / 600) / Math.pow(p.pressAtm, 0.35));
      const pistY = -1.6 + hFrac * 3.2;
      dynamicRefs.piston.position.y = pistY;
      halfX = halfZ = 0.92;
      minY = -1.8; maxY = pistY - 0.16;
      speed = 1.4 * Math.sqrt(p.tempCharles / 300) * 1.6;
    }

    particles.forEach(pt => {
      pt.mesh.position.x += pt.vx * speed * dt;
      pt.mesh.position.y += pt.vy * speed * dt;
      pt.mesh.position.z += pt.vz * speed * dt;
      if (pt.mesh.position.x > halfX - 0.12) { pt.mesh.position.x = halfX - 0.12; pt.vx = -Math.abs(pt.vx); }
      if (pt.mesh.position.x < -halfX + 0.12) { pt.mesh.position.x = -halfX + 0.12; pt.vx = Math.abs(pt.vx); }
      if (pt.mesh.position.z > halfZ - 0.12) { pt.mesh.position.z = halfZ - 0.12; pt.vz = -Math.abs(pt.vz); }
      if (pt.mesh.position.z < -halfZ + 0.12) { pt.mesh.position.z = -halfZ + 0.12; pt.vz = Math.abs(pt.vz); }
      if (pt.mesh.position.y > maxY - 0.12) { pt.mesh.position.y = maxY - 0.12; pt.vy = -Math.abs(pt.vy); }
      if (pt.mesh.position.y < minY + 0.12) { pt.mesh.position.y = minY + 0.12; pt.vy = Math.abs(pt.vy); }
    });

    const now = performance.now();
    if (!cam.dragging && now - cam.idleSince > 2200) cam.tTheta += dt * 0.15;
    const lerpF = 1 - Math.exp(-9 * dt);
    cam.theta += (cam.tTheta - cam.theta) * lerpF;
    cam.phi += (cam.tPhi - cam.phi) * lerpF;
    cam.radius += (cam.tRadius - cam.radius) * lerpF;
    camera.position.set(
      cam.radius * Math.sin(cam.phi) * Math.cos(cam.theta),
      cam.radius * Math.cos(cam.phi),
      cam.radius * Math.sin(cam.phi) * Math.sin(cam.theta)
    );
    camera.lookAt(0, 0, 0);
  }

  function draw2DFallback() {
    if (!ctx2d || !canvasEl) return;
    const w = canvasEl.clientWidth || 600, h = canvasEl.clientHeight || 420;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvasEl.width !== Math.floor(w * dpr)) { canvasEl.width = Math.floor(w * dpr); canvasEl.height = Math.floor(h * dpr); }
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2d.clearRect(0, 0, w, h);
    ctx2d.strokeStyle = '#1d4ed8';
    ctx2d.strokeRect(w * 0.25, h * 0.2, w * 0.5, h * 0.6);
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) * 0.001);
    lastFrame = now;

  }

  function unmount() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }

    if (interObs) { interObs.disconnect(); interObs = null; }
    if (useWebGL) { disposeGroup(); if (renderer) renderer.dispose(); }
    renderer = null; scene = null; camera = null; canvasEl = null; ctx2d = null;
  }

  return {
    mount, unmount,
    setModel(key) { stateRef.modelKey = key; buildApparatus(key); },
    setParam(k, val) { stateRef.params[k] = Number(val); if (k === 'boxSize' || k === 'molCount') buildApparatus(stateRef.modelKey); },
    getParams() { return stateRef.params; },
    getModel() { return stateRef.modelKey; },
    isWebGLActive() { return useWebGL; }
  };
})();
