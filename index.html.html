// ============================================================================
// 6. STATE MANAGEMENT, EXAM ENGINE & RENDERING
// ============================================================================
const STORAGE_KEY = 'physics_gas_150_v1';
const TAB_STATE_KEY = 'vatly12_tab_v1';

const AppStore = (() => {
  let lastStageKey = '';
  const state = {
    theme: 'light',
    manualTheme: false,
    view: 'lobby',        // 'lobby' | 'quiz' | 'explore'
    lobbyFilter: 'all',   // 'all' | 'core' | 'sup' | 'theory_out' | 'calc_out' | 'exam_all'
    expandedGroups: {},   // groupId -> boolean (collapsed by default on load)
    chapter: 1,           // 1..14 | 'all' | 'wrong'
    originChapter: 1,     // parent chapter before entering 'wrong' review
    studyMode: 'practice',
    queue: PHYSICS_QUESTIONS.filter(q => q.ch === 1),
    index: 0,
    answers: {},
    checked: {},
    examSubmitted: false,
    examEndAt: 0,
    examTimerId: null,
    bestExam: null,
    progress: {},
    sessions: {},
    lastChapter: null,
    examDraft: null,
    examHistory: [],
    returnChapterOnExplore: null
  };

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d.manualTheme && (d.theme === 'light' || d.theme === 'dark')) {
        state.theme = d.theme;
        state.manualTheme = true;
      }
      if (d.progress && typeof d.progress === 'object') state.progress = d.progress;
      if (Number.isFinite(d.bestExam)) state.bestExam = d.bestExam;
      if (d.sessions && typeof d.sessions === 'object') state.sessions = d.sessions;
      if (d.lastChapter !== undefined && d.lastChapter !== null) state.lastChapter = String(d.lastChapter);
      if (d.examDraft && typeof d.examDraft === 'object' && d.examDraft.endAt > Date.now()) {
        state.examDraft = d.examDraft;
      }
      if (Array.isArray(d.examHistory)) state.examHistory = d.examHistory.slice(0, 15);
    } catch (_) {}
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        theme: state.theme,
        manualTheme: state.manualTheme,
        bestExam: state.bestExam,
        progress: state.progress,
        sessions: state.sessions,
        lastChapter: state.lastChapter,
        examDraft: state.examDraft,
        examHistory: state.examHistory
      }));
    } catch (_) {}
  }

  function saveTabState() {
    try {
      sessionStorage.setItem(TAB_STATE_KEY, JSON.stringify({
        view: state.view,
        chapter: state.chapter,
        studyMode: state.studyMode
      }));
    } catch (_) {}
  }

  function saveCurrentSession() {
    if (state.view === 'quiz') {
      if (state.studyMode === 'exam') {
        if (!state.examSubmitted && state.examEndAt > Date.now()) {
          state.examDraft = {
            queueIds: state.queue.map(q => q.id),
            answers: { ...state.answers },
            index: state.index,
            endAt: state.examEndAt,
            updatedAt: Date.now()
          };
        }
      } else {
        const key = String(state.chapter);
        const ids = new Set(state.queue.map(q => q.id));
        const chAns = {};
        const chChk = {};
        Object.keys(state.answers).forEach(k => { if (ids.has(Number(k))) chAns[k] = state.answers[k]; });
        Object.keys(state.checked).forEach(k => { if (ids.has(Number(k))) chChk[k] = state.checked[k]; });
        const hasActivity = Object.keys(chAns).length > 0 || Object.keys(chChk).length > 0 || state.index > 0 || Boolean(state.sessions[key]);
        if (hasActivity) {
          state.sessions[key] = {
            index: state.index,
            answers: chAns,
            checked: chChk,
            ...(key === 'wrong' ? { queueIds: state.queue.map(q => q.id) } : {}),
            updatedAt: Date.now()
          };
          state.lastChapter = key;
        }
      }
    }
    save();
    saveTabState();
  }

  function applyTheme(theme) {
    state.theme = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.textContent = state.theme === 'dark' ? 'Oscilloscope Dark' : 'Ivory Lab';
  }

  function toggleTheme() {
    AudioBench.click();
    state.manualTheme = true;
    applyTheme(state.theme === 'light' ? 'dark' : 'light');
    save();
  }

  function toggleMapSheet(force) {
    const back = document.getElementById('mobMapBackdrop');
    const sheet = document.getElementById('mobMapSheet');
    if (!back || !sheet) return;
    const next = force !== undefined ? force : !sheet.classList.contains('open');
    back.classList.toggle('open', next);
    sheet.classList.toggle('open', next);
    if (next) {
      setTimeout(() => sheet.querySelector('.nav-dot.current')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80);
    }
  }

  function syncTopbarTabs() {
    document.querySelectorAll('.mode-tab').forEach(btn => {
      const target = btn.dataset.view;
      btn.classList.toggle('active', target === 'explore' ? state.view === 'explore' : state.view !== 'explore');
    });
  }

  function getTopicTitle(chKey) {
    if (chKey === 'all') return `Tổng hợp (${PHYSICS_QUESTIONS.length} câu)`;
    if (chKey === 'wrong') return 'Ôn tập câu làm sai';
    const chObj = CHAPTERS.find(c => String(c.id) === String(chKey));
    return chObj ? `${chObj.code} · ${chObj.title}` : `Chuyên đề ${chKey}`;
  }

  function getTopicQueue(ch) {
    const k = String(ch);
    if (k === 'all') return [...PHYSICS_QUESTIONS];
    if (k === 'wrong') {
      const savedIds = state.sessions.wrong?.queueIds;
      if (Array.isArray(savedIds) && savedIds.length) {
        const byId = new Map(PHYSICS_QUESTIONS.map(q => [q.id, q]));
        const restored = savedIds.map(id => byId.get(id)).filter(Boolean);
        if (restored.length) return restored;
      }
      return PHYSICS_QUESTIONS.filter(q => state.progress[q.id]?.ok === false);
    }
    return PHYSICS_QUESTIONS.filter(q => q.ch === Number(ch));
  }

  function fmtTime(ts) {
    if (!ts) return '';
    try {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
    } catch (_) {
      return '';
    }
  }

  function openChapter(ch, opts = {}) {
    if (!opts.silent) AudioBench.click();
    toggleMapSheet(false);
    toggleScoreModal(false);
    ExamEngine.stopTimer();
    PhysicsThreeEngine.unmount();
    const qList = getTopicQueue(ch);
    if (!qList.length) {
      if (opts.fromRestore) { backToLobby(true); }
      return;
    }
    const key = String(ch);
    const saved = state.sessions[key];
    state.chapter = (ch === 'all' || ch === 'wrong') ? ch : Number(ch);
    if (state.chapter !== 'wrong') state.originChapter = state.chapter;
    state.queue = qList;
    state.answers = saved && saved.answers ? { ...saved.answers } : {};
    state.checked = saved && saved.checked ? { ...saved.checked } : {};
    state.index = saved ? Math.min(saved.index || 0, qList.length - 1) : 0;
    state.studyMode = 'practice';
    state.examSubmitted = false;
    state.view = 'quiz';
    state.returnChapterOnExplore = key;
    if (saved) state.lastChapter = key;
    if (!opts.fromRestore && window.history && window.history.pushState) {
      try { window.history.pushState({ vatlyView: 'quiz' }, ''); } catch (_) {}
    }
    save();
    saveTabState();
    syncTopbarTabs();
    renderStage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function resetTopic(ch, ev) {
    if (ev) ev.stopPropagation();
    AudioBench.click();
    toggleScoreModal(false);
    const key = String(ch);
    delete state.sessions[key];
    if (state.lastChapter === key) state.lastChapter = null;
    if (state.view === 'quiz' && String(state.chapter) === key) {
      state.answers = {};
      state.checked = {};
      state.index = 0;
    }
    save();
    renderStage();
  }

  function clearAllHistory() {
    AudioBench.click();
    state.sessions = {};
    state.progress = {};
    state.examDraft = null;
    state.examHistory = [];
    state.bestExam = null;
    state.lastChapter = null;
    save();
    renderStage();
  }

  function backToLobby(fromPopState = false) {
    if (!fromPopState && state.view !== 'lobby') AudioBench.click();
    if (state.view === 'quiz') saveCurrentSession();
    ExamEngine.stopTimer();
    PhysicsThreeEngine.unmount();
    toggleMapSheet(false);
    toggleScoreModal(false);
    state.view = 'lobby';
    saveTabState();
    syncTopbarTabs();
    renderStage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function setLobbyFilter(f) {
    AudioBench.click();
    state.lobbyFilter = f;
    if (f !== 'all') delete state.expandedGroups[f];
    renderStage();
  }

  function toggleGroup(secId) {
    AudioBench.click();
    const secEl = document.getElementById(`lobbySec_${secId}`);
    const curOpen = secEl ? secEl.classList.contains('open') : Boolean(state.expandedGroups[secId]);
    const next = !curOpen;
    state.expandedGroups[secId] = next;
    if (secEl) {
      secEl.classList.toggle('open', next);
      const btn = secEl.querySelector('.lobby-sec-toggle');
      if (btn) btn.setAttribute('aria-expanded', String(next));
    } else {
      renderStage();
    }
  }

  function setView(view) {
    AudioBench.click();
    toggleMapSheet(false);
    if (view === 'lobby') { backToLobby(); return; }
    if (view === 'quiz' && state.view === 'explore' && state.returnChapterOnExplore) {
      openChapter(state.returnChapterOnExplore);
      return;
    }
    if (view !== state.view && view !== 'quiz') ExamEngine.stopTimer();
    if (state.view === 'explore' && view !== 'explore') PhysicsThreeEngine.unmount();
    state.view = view;
    saveTabState();
    syncTopbarTabs();
    renderStage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function openModelFromQuestion(modelKey) {
    saveCurrentSession();
    state.returnChapterOnExplore = String(state.chapter);
    PhysicsThreeEngine.setModel(modelKey);
    if (window.history && window.history.pushState) {
      try { window.history.pushState({ vatlyView: 'explore' }, ''); } catch (_) {}
    }
    setView('explore');
  }

  function renderTopicCard(cfg) {
    const key = String(cfg.key);
    const saved = state.sessions[key];
    const qs = cfg.questions;
    const total = qs.length;
    const checkedCount = saved && saved.checked
      ? Object.keys(saved.checked).filter(id => saved.checked[id]).length
      : 0;
    const pct = total ? Math.round((checkedCount / total) * 100) : 0;
    const isDone = total > 0 && checkedCount >= total;
    const inProg = checkedCount > 0 && !isDone;
    const cls = cfg.isExam ? 'topic-card is-exam' : isDone ? 'topic-card is-done' : inProg ? 'topic-card in-prog' : 'topic-card';
    const badgeCls = cfg.isExam ? 'topic-badge badge-calc' : isDone ? 'topic-badge badge-done' : inProg ? 'topic-badge badge-prog' : 'topic-badge badge-idle';
    const badgeTxt = cfg.badgeOverride || (isDone ? '✓ Hoàn thành' : inProg ? `Đang làm ${checkedCount}/${total}` : `${total} câu`);
    const footRight = saved
      ? `<button type="button" class="topic-reset-mini" onclick="AppStore.resetTopic('${key}', event)">↺ Làm lại</button>`
      : `<span>Vào làm →</span>`;

    return `<div class="${cls}" role="button" tabindex="0" onclick="${cfg.onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${cfg.onClick}}">
      <div class="topic-card-top">
        <span>${cfg.code}</span>
        <span class="${badgeCls}">${badgeTxt}</span>
      </div>
      <div class="topic-title">${cfg.title}</div>
      <div class="topic-blurb">${cfg.blurb}</div>
      ${cfg.hideBar ? '' : `<div class="topic-prog-track"><div class="topic-prog-fill" style="width:${pct}%"></div></div>`}
      <div class="topic-card-foot">
        <span>${inProg ? `Đang ở Câu ${Math.min((saved.index || 0) + 1, total)}/${total}` : isDone ? `Đã chấm ${total}/${total} câu` : (cfg.footHint || 'Chưa làm')}</span>
        ${footRight}
      </div>
    </div>`;
  }

  function renderHistorySection() {
    const sessRows = Object.entries(state.sessions)
      .filter(([, s]) => s && s.updatedAt)
      .sort((a, b) => b[1].updatedAt - a[1].updatedAt)
      .slice(0, 6)
      .map(([k, s]) => {
        const qList = getTopicQueue(k);
        const total = qList.length || 1;
        const chkN = s.checked ? Object.keys(s.checked).length : 0;
        const okN = s.checked ? qList.filter(q => s.checked[q.id] && ExamEngine.gradeQuestion(q, s.answers[q.id]).ok).length : 0;
        return `<div class="history-row">
          <div>
            <strong>${getTopicTitle(k)}</strong>
            <div style="font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)">Đã làm ${chkN}/${total} · Đúng ${okN} · Câu ${(s.index || 0) + 1} · ${fmtTime(s.updatedAt)}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" class="inst-btn" onclick="AppStore.openChapter(${k === 'all' || k === 'wrong' ? `'${k}'` : Number(k)})">Làm tiếp →</button>
          </div>
        </div>`;
      });

    const examRows = (state.examHistory || []).slice(0, 5).map(h => `
      <div class="history-row">
        <div>
          <strong>⚡ Đề Thi Thử 40 Câu · 50 Phút</strong>
          <div style="font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)">Điểm ${h.score10} / 10 (${h.pct}%) · Đúng ${h.rightN}/${h.total} · ${fmtTime(h.ts)}</div>
        </div>
        <button type="button" class="inst-btn" onclick="ExamEngine.startExam50()">Thi lại</button>
      </div>
    `);

    const allRows = [...sessRows, ...examRows];
    if (!allRows.length) return '';
    return `<section class="history-panel">
      <div class="lobby-sec-head">
        <span>🕒 Lịch sử làm bài gần đây (Tự động lưu)</span>
        <button type="button" class="topic-reset-mini" onclick="AppStore.clearAllHistory()">Xóa lịch sử</button>
      </div>
      <div class="history-list">${allRows.join('')}</div>
    </section>`;
  }

  function renderLobbyStage() {
    const totalQ = PHYSICS_QUESTIONS.length;
    const pKeys = Object.keys(state.progress);
    const solved = pKeys.length;
    const scoreSum = pKeys.reduce((acc, k) => acc + (state.progress[k]?.score || 0), 0);
    const accStr = solved ? `${Math.round((scoreSum / solved) * 100)}%` : '—';
    const wrongN = PHYSICS_QUESTIONS.filter(q => state.progress[q.id]?.ok === false).length;
    const bestStr = state.bestExam !== null ? `${state.bestExam}%` : '—';

    let resumeHtml = '';
    if (state.examDraft && state.examDraft.endAt > Date.now()) {
      const remMin = Math.max(1, Math.ceil((state.examDraft.endAt - Date.now()) / 60000));
      const ansN = Object.keys(state.examDraft.answers || {}).length;
      resumeHtml += `<div class="resume-banner is-exam">
        <div>
          <strong style="font-size:13.5px">⚡ Đang có bài Thi thử 40 câu dở (còn ~${remMin} phút)</strong>
          <div style="font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)">Đã chọn ${ansN}/${state.examDraft.queueIds.length} câu · Câu ${(state.examDraft.index || 0) + 1}</div>
        </div>
        <button type="button" class="primary-btn" onclick="ExamEngine.resumeDraft()">▶ Tiếp tục thi</button>
      </div>`;
    }
    if (state.lastChapter && state.sessions[state.lastChapter]) {
      const s = state.sessions[state.lastChapter];
      const qList = getTopicQueue(state.lastChapter);
      if (qList.length) {
        const chkN = Object.keys(s.checked || {}).length;
        const chArg = (state.lastChapter === 'all' || state.lastChapter === 'wrong') ? `'${state.lastChapter}'` : Number(state.lastChapter);
        resumeHtml += `<div class="resume-banner">
          <div>
            <strong style="font-size:13.5px">▶ Đang làm dở: ${getTopicTitle(state.lastChapter)}</strong>
            <div style="font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)">Đã lưu ${chkN}/${qList.length} câu · Đang ở Câu ${Math.min((s.index || 0) + 1, qList.length)}</div>
          </div>
          <button type="button" class="primary-btn" onclick="AppStore.openChapter(${chArg})">Làm tiếp →</button>
        </div>`;
      }
    }

    const lf = state.lobbyFilter;
    const filters = [
      { id: 'all', label: 'Tất cả (16)' },
      { id: 'core', label: '5 Mục Cốt lõi' },
      { id: 'sup', label: 'Phần Bổ sung' },
      { id: 'theory_out', label: 'Đề cương Lý thuyết' },
      { id: 'calc_out', label: 'Đề cương Tính toán' },
      { id: 'exam_all', label: 'Tổng hợp & Thi' }
    ];

    const mapChapterCfg = ch => ({
      key: ch.id,
      code: ch.code,
      title: ch.title,
      blurb: ch.blurb,
      questions: PHYSICS_QUESTIONS.filter(q => q.ch === ch.id),
      onClick: `AppStore.openChapter(${ch.id})`
    });

    const renderLobbyGroup = ({ id, title, meta, sessionKeys, totalQCount, cardsHtml }) => {
      const isOpen = state.expandedGroups[id] !== undefined ? state.expandedGroups[id] : (lf !== 'all');
      const doneN = (sessionKeys || []).reduce((acc, sk) => {
        const s = state.sessions[String(sk)];
        return acc + (s && s.checked ? Object.keys(s.checked).filter(qid => s.checked[qid]).length : 0);
      }, 0);
      const isDone = totalQCount > 0 && doneN >= totalQCount;
      const badgeCls = isDone ? 'badge-done' : doneN > 0 ? 'badge-prog' : 'badge-idle';
      const badgeTxt = isDone ? '✓ Hoàn thành' : doneN > 0 ? `Đang làm ${doneN}/${totalQCount}` : meta;

      return `<section class="lobby-section ${isOpen ? 'open' : ''}" id="lobbySec_${id}">
        <button type="button" class="lobby-sec-toggle" aria-expanded="${isOpen}" onclick="AppStore.toggleGroup('${id}')">
          <span class="sec-toggle-left">
            <span class="sec-toggle-title">${title}</span>
            <span class="sec-chevron-pill" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </span>
          </span>
          <span class="topic-badge ${badgeCls}">${badgeTxt}</span>
        </button>
        <div class="lobby-sec-body">
          <div class="lobby-sec-inner">
            <div class="topic-grid">${cardsHtml}</div>
          </div>
        </div>
      </section>`;
    };

    const coreSec = (lf === 'all' || lf === 'core') ? renderLobbyGroup({
      id: 'core',
      title: '5 Mục · Mỗi mục 30 câu',
      meta: '5 mục · 150 câu',
      sessionKeys: [1, 2, 3, 4, 5],
      totalQCount: 150,
      cardsHtml: CHAPTERS.filter(c => c.id <= 5).map(c => renderTopicCard(mapChapterCfg(c))).join('')
    }) : '';

    const supSec = (lf === 'all' || lf === 'sup') ? renderLobbyGroup({
      id: 'sup',
      title: 'Phần Bổ Sung (Tách riêng)',
      meta: '3 mục · 45 câu',
      sessionKeys: [6, 7, 8],
      totalQCount: 45,
      cardsHtml: CHAPTERS.filter(c => c.id >= 6 && c.id <= 8).map(c => renderTopicCard(mapChapterCfg(c))).join('')
    }) : '';

    const theoryOutIds = [9, 11, 13];
    const calcOutIds = [10, 12, 14];
    const outlineTheorySec = (lf === 'all' || lf === 'theory_out') ? renderLobbyGroup({
      id: 'theory_out',
      title: 'Đề cương · Lý thuyết',
      meta: '3 mục · 33 câu',
      sessionKeys: theoryOutIds,
      totalQCount: 33,
      cardsHtml: CHAPTERS.filter(c => theoryOutIds.includes(c.id)).map(c => renderTopicCard(mapChapterCfg(c))).join('')
    }) : '';

    const outlineCalcSec = (lf === 'all' || lf === 'calc_out') ? renderLobbyGroup({
      id: 'calc_out',
      title: 'Đề cương · Tính toán',
      meta: '3 mục · 38 câu',
      sessionKeys: calcOutIds,
      totalQCount: 38,
      cardsHtml: CHAPTERS.filter(c => calcOutIds.includes(c.id)).map(c => renderTopicCard(mapChapterCfg(c))).join('')
    }) : '';

    const examDraftAns = state.examDraft ? Object.keys(state.examDraft.answers || {}).length : 0;
    const examAllSec = (lf === 'all' || lf === 'exam_all') ? renderLobbyGroup({
      id: 'exam_all',
      title: 'Tổng hợp & Thi thử',
      meta: `${totalQ} câu · Đề 50p`,
      sessionKeys: ['all'],
      totalQCount: totalQ,
      cardsHtml: `
        ${renderTopicCard({
          key: 'all',
          code: 'TỔNG HỢP',
          title: 'Trọn bộ 3 dạng đề',
          blurb: `Toàn bộ ${totalQ} câu Chương 2 Khí Lí Tưởng (ABCD · Đúng/Sai) trộn liền mạch.`,
          questions: PHYSICS_QUESTIONS,
          onClick: `AppStore.openChapter('all')`
        })}
        ${renderTopicCard({
          key: '__exam__',
          code: '40 CÂU · 50P',
          title: 'Đề thi thử bấm giờ',
          blurb: 'Trộn ngẫu nhiên 40 câu từ ngân hàng đề, đồng hồ đếm ngược 50 phút & chấm điểm 10.',
          questions: [],
          isExam: true,
          hideBar: true,
          badgeOverride: state.examDraft ? `Đang thi ${examDraftAns}/40` : 'THI THỬ',
          footHint: state.bestExam !== null ? `Kỷ lục cao nhất: ${state.bestExam}%` : 'Ấn để bắt đầu bấm giờ',
          onClick: state.examDraft && state.examDraft.endAt > Date.now() ? 'ExamEngine.resumeDraft()' : 'ExamEngine.startExam50()'
        })}
      `
    }) : '';

    return `<div class="stage-view lobby-wrap">
      <section class="lobby-hero">
        <div>
          <div class="stage-eyebrow">Vật Lý 12 · Chương 2: Khí Lí Tưởng</div>
          <h1 class="stage-h1">Chọn Chủ Đề Luyện Tập &amp; Thi Thử</h1>
          <p class="stage-lead">Mọi tiến độ được tự động lưu theo từng chủ đề. Chọn một mục để vào làm bài, xong ấn <b>← Chủ đề</b> để quay ra.</p>
        </div>
        <div class="lobby-stats-grid">
          <div class="stat-card"><div class="stat-val">${solved}/${totalQ}</div><div class="stat-lbl">Đã giải</div></div>
          <div class="stat-card"><div class="stat-val" style="color:var(--emerald)">${accStr}</div><div class="stat-lbl">Chính xác</div></div>
          <div class="stat-card"><div class="stat-val" style="color:var(--amber)">${wrongN}</div><div class="stat-lbl">Câu cần ôn lại</div></div>
          <div class="stat-card"><div class="stat-val" style="color:var(--cobalt)">${bestStr}</div><div class="stat-lbl">Kỷ lục Thi thử</div></div>
        </div>
        ${resumeHtml}
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button type="button" class="primary-btn" onclick="ExamEngine.startExam50()">⚡ Thi thử 40 câu · 50p</button>
          <button type="button" class="inst-btn ${wrongN > 0 ? 'is-amber' : ''}" ${wrongN === 0 ? 'disabled style="opacity:0.48;cursor:not-allowed"' : ''} onclick="AppStore.openChapter('wrong')">↺ Ôn tất cả câu sai (${wrongN})</button>
          <button type="button" class="inst-btn" onclick="AppStore.setView('explore')">🔬 Khám phá Mô hình 3D</button>
        </div>
      </section>

      <div class="lobby-filter-bar" role="tablist" aria-label="Lọc nhóm chuyên đề">
        ${filters.map(f => `<button type="button" class="lf-pill ${lf === f.id ? 'active' : ''}" onclick="AppStore.setLobbyFilter('${f.id}')">${f.label}</button>`).join('')}
      </div>

      <div class="lobby-accordion-stack">
        ${coreSec}
        ${supSec}
        ${outlineTheorySec}
        ${outlineCalcSec}
        ${examAllSec}
      </div>
      ${renderHistorySection()}
    </div>`;
  }

  function renderModelPills(activeKey) {
    return MODELS_SPEC.map(m =>
      `<button type="button" class="model-tab-btn ${m.key === activeKey ? 'active' : ''}" onclick="AppStore.switch3DModel('${m.key}')">${m.tab}</button>`
    ).join('');
  }

  function renderExploreStage() {
    const mKey = PhysicsThreeEngine.getModel();
    const spec = MODELS_SPEC.find(m => m.key === mKey) || MODELS_SPEC[0];
    const p = PhysicsThreeEngine.getParams();

    return `
      <div class="quiz-back-bar">
        <button type="button" class="back-lobby-btn" onclick="AppStore.backToLobby()">← Chủ đề</button>
        <div class="quiz-bar-title">🔬 Mô hình Vật Lý 3D · ${spec.title}</div>
      </div>
      <div class="stage-view observatory-stage">
        <div class="stage-header-band">
          <div>
            <div class="stage-eyebrow">3D Apparatus Observatory</div>
            <h1 class="stage-h1">Khám phá Mô hình Vật Lý 3D</h1>
            <p class="stage-lead">Kéo xoay 360°, chụm/giãn 2 ngón (hoặc cuộn) thu phóng và chỉnh thông số theo thời gian thực.</p>
          </div>
          <button type="button" class="primary-btn" onclick="AppStore.openChapter(AppStore.state.returnChapterOnExplore || 1)">Luyện bài tập chương này →</button>
        </div>

        <div class="model-pill-strip" id="modelPillStrip" role="tablist" aria-label="Chọn mô hình 3D">${renderModelPills(mKey)}</div>

        <div class="discovery-grid">
          <div class="scope-viewport">
            <canvas id="physics3dCanvas"></canvas>
            <div class="scope-hud-top">
              <span class="scope-badge" id="scopeTitleHud">${spec.title}</span>
              <span class="scope-badge" id="engineTag">WebGL PBR · Damped Glide</span>
            </div>
            <div class="scope-hud-bot">
              <span class="scope-hint">Kéo xoay 360° · Pinch/Cuộn zoom</span>
              <span class="scope-hint" id="scopeDescHud">${spec.desc}</span>
            </div>
          </div>

          <aside class="inspector-panel" id="inspectorPanel">${renderInspectorHtml(spec, p)}</aside>
        </div>
      </div>`;
  }

  function renderInspectorHtml(spec, p) {
    const slidersHtml = spec.sliders.map(sl => `
      <div class="slider-row">
        <div class="slider-meta">
          <label for="slider_${sl.id}">${sl.label}</label>
          <span class="slider-val" id="val_${sl.id}">${p[sl.id]}</span>
        </div>
        <input type="range" id="slider_${sl.id}" class="phys-slider" min="${sl.min}" max="${sl.max}" step="${sl.step}" value="${p[sl.id]}" oninput="AppStore.update3DParam('${sl.id}', this.value)" />
      </div>
    `).join('');
    const extraBtn = spec.key === 'bohr_atom'
      ? `<button type="button" class="primary-btn" onclick="PhysicsThreeEngine.triggerPhoton();AudioBench.correct()">Kích thích bức xạ Photon</button>`
      : '';
    return `
      <div>
        <div class="rail-section-label">Thông số &amp; Phương trình</div>
        <div class="panel-heading">${spec.title}</div>
      </div>
      <div class="panel-equation">${spec.eq}</div>
      ${slidersHtml}
      ${extraBtn}
      <div class="readout-grid" id="liveTelemetryReadout">${computeTelemetry(spec.key, p)}</div>`;
  }

  function computeTelemetry(key, p) {
    if (key === 'gas_box') {
      const wAvg = (1.5 * 1.38e-23 * p.tempK * 1e21).toFixed(2);
      const pRel = ((p.molCount / 24) * (p.tempK / 300) / Math.pow(p.boxSize / 3.0, 3)).toFixed(2);
      return cell('Nhiệt độ T', `${p.tempK} K (${p.tempK - 273} °C)`) + cell('Động năng W̄đ', `${wAvg}×10⁻²¹ J`) + cell('Áp suất tương đối', `${pRel} atm`) + cell('Thể tích V', `${Math.pow(p.boxSize, 3).toFixed(1)} đvtt`);
    }
    if (key === 'boyle_piston') {
      const pVal = ((2.0 * (p.tempBoyle / 300)) / p.volBoyle).toFixed(2);
      return cell('Thể tích V', `${p.volBoyle.toFixed(1)} lít`) + cell('Áp suất p', `${pVal} atm`) + cell('Tích p·V', `${(Number(pVal) * p.volBoyle).toFixed(2)} atm·L`) + cell('Nhiệt độ T', `${p.tempBoyle} K`);
    }
    const vVal = (2.0 * (p.tempCharles / 300) / p.pressAtm).toFixed(2);
    return cell('Nhiệt độ T', `${p.tempCharles} K (${p.tempCharles - 273} °C)`) + cell('Thể tích V', `${vVal} lít`) + cell('Áp suất cố định', `${p.pressAtm.toFixed(1)} atm`) + cell('Tỉ số V/T', `${(Number(vVal) / p.tempCharles * 1000).toFixed(2)}×10⁻³`);
  }

  function cell(k, v) {
    return `<div class="readout-cell"><span class="readout-k">${k}</span><span class="readout-v">${v}</span></div>`;
  }

  function renderScoreModalHtml() {
    const queue = state.queue || [];
    const maxPts = queue.length || 1;
    let totalPts = 0;
    let rightN = 0;
    let doneN = 0;
    queue.forEach(item => {
      const graded = (state.studyMode === 'practice' && Boolean(state.checked[item.id])) || state.examSubmitted;
      if (!graded) return;
      doneN++;
      const r = ExamEngine.gradeQuestion(item, state.answers[item.id]);
      totalPts += r.score;
      if (r.ok) rightN++;
    });
    const wrongList = ExamEngine.getWrongQuestions();
    const wrongN = wrongList.length;
    const pct = Math.round((totalPts / maxPts) * 100);
    const score10 = ((totalPts / maxPts) * 10).toFixed(2).replace('.', ',');
    const tone = pct >= 80 ? 'var(--emerald)' : pct >= 50 ? 'var(--amber)' : 'var(--crimson)';
    const softTone = pct >= 80 ? 'var(--emerald-soft)' : pct >= 50 ? 'var(--amber-soft)' : 'var(--crimson-soft)';
    const verdictTxt = pct >= 80
      ? '🌟 Xuất sắc · Nắm vững kiến thức'
      : pct >= 50
        ? '👍 Đạt yêu cầu · Rèn thêm câu sai'
        : '💪 Cần ôn tập lại chuyên đề này';
    const titleTxt = state.studyMode === 'exam' ? '⚡ Đề Thi Thử 40 Câu · 50 Phút' : getTopicTitle(state.chapter);

    return `<div class="score-modal-card">
      <div class="score-modal-head">
        <div>
          <div class="stage-eyebrow">${state.studyMode === 'exam' ? 'Kết quả Thi thử' : 'Tổng kết điểm chuyên đề'}</div>
          <strong style="font-family:var(--font-display);font-size:16px">${titleTxt}</strong>
        </div>
        <button type="button" class="inst-btn" style="height:30px;padding:0 10px;font-size:12px" onclick="AppStore.toggleScoreModal(false)">Đóng ✕</button>
      </div>

      <div class="score-hero-box">
        <div class="result-ring">
          <svg viewBox="0 0 104 104" aria-hidden="true"><circle class="ring-track" cx="52" cy="52" r="46"/><circle class="ring-fill" cx="52" cy="52" r="46" style="stroke:${tone};stroke-dashoffset:${(289 * (1 - pct / 100)).toFixed(1)}"/></svg>
          <b style="color:${tone}">${pct}%</b>
        </div>
        <div class="score-big-num">${score10} / 10 điểm</div>
        <div class="score-verdict-pill" style="background:${softTone};color:${tone}">${verdictTxt}</div>
      </div>

      <div class="score-stat-grid">
        <div class="score-stat-box">
          <span class="score-stat-val" style="color:var(--emerald)">${rightN}/${queue.length}</span>
          <span class="score-stat-lbl">Câu đúng</span>
        </div>
        <div class="score-stat-box">
          <span class="score-stat-val" style="color:var(--crimson)">${wrongN}</span>
          <span class="score-stat-lbl">Câu làm sai</span>
        </div>
        <div class="score-stat-box">
          <span class="score-stat-val" style="color:var(--cobalt)">${doneN}/${queue.length}</span>
          <span class="score-stat-lbl">Đã chấm</span>
        </div>
      </div>

      <div class="score-modal-actions">
        <button type="button" class="primary-btn" id="scoreRetryWrongBtn" style="${wrongN === 0 ? 'opacity:0.5;cursor:not-allowed' : ''}" ${wrongN === 0 ? 'disabled' : ''} onclick="ExamEngine.retryWrong()">↺ Làm lại những câu sai (${wrongN})</button>
        <button type="button" class="inst-btn" id="scoreResetAllBtn" onclick="ExamEngine.resetSession()">⟳ Làm lại tất cả</button>
        <button type="button" class="inst-btn" id="scoreBackMenuBtn" onclick="AppStore.backToLobby()">← Về Menu</button>
      </div>
    </div>`;
  }

  function toggleScoreModal(force) {
    const modal = document.getElementById('scoreModalBackdrop');
    if (!modal) return;
    const next = force !== undefined ? force : !modal.classList.contains('open');
    if (next) {
      toggleMapSheet(false);
      modal.innerHTML = renderScoreModalHtml();
    }
    modal.classList.toggle('open', next);
  }

  function syncMobileOverlays() {
    const wrap = document.getElementById('mobNextFabWrap');
    const fab = document.getElementById('mobNextFab');
    const mapSheet = document.getElementById('mobMapSheet');
    const scoreModal = document.getElementById('scoreModalBackdrop');

    if (state.view !== 'quiz') {
      if (wrap) wrap.classList.remove('visible');
      if (mapSheet) mapSheet.innerHTML = '';
      if (scoreModal) scoreModal.classList.remove('open');
      return;
    }

    const queue = state.queue;
    const q = queue[state.index] || queue[0];
    if (!q) {
      if (wrap) wrap.classList.remove('visible');
      return;
    }

    const isExamRunning = state.studyMode === 'exam' && !state.examSubmitted;
    const showResult = (state.studyMode === 'practice' && Boolean(state.checked[q.id])) || state.examSubmitted;
    const ans = state.answers[q.id];
    const g = ExamEngine.gradeQuestion(q, ans);

    if (wrap && fab) {
      let show = false;
      let cls = 'mob-next-fab';
      let label = '';
      let onClick = '';

      if (showResult) {
        show = true;
        if (state.index >= queue.length - 1) {
          cls = 'mob-next-fab is-right';
          label = '🏆 Hoàn thành · Tính điểm';
          onClick = 'AppStore.toggleScoreModal(true)';
        } else {
          const keyHint = q.type === 'mcq'
            ? ['A', 'B', 'C', 'D'][q.answer]
            : q.type === 'short'
              ? String(q.answer).replace('.', ',')
              : `${g.right || 0}/4 ý`;
          cls = g.ok ? 'mob-next-fab is-right' : 'mob-next-fab';
          label = g.ok ? '✓ Đúng · Tiếp theo →' : `✕ Sai (Đ.án ${keyHint}) · Tiếp →`;
          onClick = `ExamEngine.jump(${state.index + 1})`;
        }
      } else if (!isExamRunning && q.type === 'tf' && Array.isArray(ans) && ans.some(v => v !== null)) {
        show = true;
        cls = 'mob-next-fab is-check';
        label = '✓ Chấm 4 ý Đ/S';
        onClick = `ExamEngine.checkTf(${q.id})`;
      } else if (!isExamRunning && q.type === 'short' && String(ans ?? '').trim() !== '') {
        show = true;
        cls = 'mob-next-fab is-check';
        label = '✓ Chấm đáp án';
        onClick = `ExamEngine.checkShort(${q.id})`;
      } else if (isExamRunning && g.done) {
        show = true;
        cls = 'mob-next-fab';
        label = state.index < queue.length - 1 ? 'Câu tiếp →' : '✓ Nộp bài';
        onClick = state.index < queue.length - 1 ? `ExamEngine.jump(${state.index + 1})` : 'ExamEngine.submitExam()';
      }

      wrap.classList.toggle('visible', show);
      if (show) {
        fab.className = cls;
        fab.textContent = label;
        fab.setAttribute('onclick', onClick);
      }
    }

    if (mapSheet) {
      mapSheet.innerHTML = ExamEngine.renderMapInnerHtml(state, true);
    }
    if (scoreModal && scoreModal.classList.contains('open')) {
      scoreModal.innerHTML = renderScoreModalHtml();
    }
  }

  function renderStage() {
    const main = document.getElementById('mainStage');
    if (!main) return;
    const brandSub = document.getElementById('brandSub');
    if (brandSub) brandSub.textContent = `Chương 2 · Khí Lí Tưởng (${PHYSICS_QUESTIONS.length} câu)`;
    const stageKey = `${state.view}|${state.lobbyFilter}|${state.chapter}|${state.studyMode}|${state.index}|${state.examSubmitted}|${state.queue.length}`;
    const sameStage = stageKey === lastStageKey;
    lastStageKey = stageKey;

    if (state.view === 'lobby') {
      main.innerHTML = renderLobbyStage();
    } else if (state.view === 'explore') {
      main.innerHTML = renderExploreStage();
      const cvs = document.getElementById('physics3dCanvas');
      PhysicsThreeEngine.mount(cvs);
      const tag = document.getElementById('engineTag');
      if (tag && !PhysicsThreeEngine.isWebGLActive()) tag.textContent = 'Canvas 2D Fallback';
    } else {
      main.innerHTML = ExamEngine.renderArena(state);
    }

    if (sameStage) main.querySelector('.stage-view')?.classList.add('static');
    syncTopbarTabs();
    syncMobileOverlays();
  }

  function switch3DModel(key) {
    AudioBench.click();
    PhysicsThreeEngine.setModel(key);
    const spec = MODELS_SPEC.find(m => m.key === key) || MODELS_SPEC[0];
    const p = PhysicsThreeEngine.getParams();
    const strip = document.getElementById('modelPillStrip');
    const titleHud = document.getElementById('scopeTitleHud');
    const descHud = document.getElementById('scopeDescHud');
    const panel = document.getElementById('inspectorPanel');
    if (strip && titleHud && descHud && panel && document.getElementById('physics3dCanvas')) {
      strip.innerHTML = renderModelPills(key);
      titleHud.textContent = spec.title;
      descHud.textContent = spec.desc;
      panel.innerHTML = renderInspectorHtml(spec, p);
    } else {
      renderStage();
    }
  }

  function update3DParam(id, val) {
    const num = Number(val);
    PhysicsThreeEngine.setParam(id, num);
    const valSpan = document.getElementById(`val_${id}`);
    if (valSpan) valSpan.textContent = num;
    const ro = document.getElementById('liveTelemetryReadout');
    if (ro) ro.innerHTML = computeTelemetry(PhysicsThreeEngine.getModel(), PhysicsThreeEngine.getParams());
  }

  function boot() {
    load();
    applyTheme(state.theme);
    try {
      const rawTab = sessionStorage.getItem(TAB_STATE_KEY);
      if (rawTab) {
        const tab = JSON.parse(rawTab);
        if (tab.view === 'quiz') {
          if (tab.studyMode === 'exam' && state.examDraft && state.examDraft.endAt > Date.now()) {
            ExamEngine.resumeDraft({ fromRestore: true });
            return;
          }
          if (tab.chapter !== undefined && tab.chapter !== null) {
            openChapter(tab.chapter, { fromRestore: true, silent: true });
            return;
          }
        } else if (tab.view === 'explore') {
          state.view = 'explore';
        }
      }
    } catch (_) {}
    renderStage();
  }

  return {
    state,
    save,
    saveCurrentSession,
    toggleTheme,
    setView,
    setLobbyFilter,
    toggleGroup,
    openChapter,
    resetTopic,
    clearAllHistory,
    backToLobby,
    getTopicTitle,
    openModelFromQuestion,
    switch3DModel,
    update3DParam,
    toggleMapSheet,
    syncMobileOverlays,
    renderStage,
    boot
  };
})();

// ============================================================================
// 7. QUIZ & EXAM ARENA ENGINE (MCQ + TIERED T/F + NUMERIC SHORT-ANSWER)
// ============================================================================
const ExamEngine = (() => {
  function gradeQuestion(q, ans) {
    if (ans === undefined || ans === null) return { done: false, score: 0 };
    if (q.type === 'mcq') {
      const ok = ans === q.answer;
      return { done: true, score: ok ? 1 : 0, ok };
    }
    if (q.type === 'tf') {
      if (!Array.isArray(ans) || ans.filter(v => v !== null).length === 0) return { done: false, score: 0 };
      let right = 0;
      for (let i = 0; i < 4; i++) {
        if (ans[i] === q.answer[i]) right++;
      }
      const tiers = [0, 0.1, 0.25, 0.5, 1.0];
      return { done: true, score: tiers[right], right, ok: right === 4 };
    }
    const parsed = parseFloat(String(ans).trim().replace(',', '.'));
    if (Number.isNaN(parsed)) return { done: false, score: 0 };
    const ok = Math.abs(parsed - q.answer) <= 0.02;
    return { done: true, score: ok ? 1 : 0, ok };
  }

  function formatSolutionHtml(exp) {
    if (!exp) return '';
    let s = String(exp).trim();
    // Break Đ/S items (<b>a) ...</b> <b>b) ...</b>) onto separate vertical lines
    s = s.replace(/\s*(<b>[a-d]\))/gi, '\n$1');
    // Break derivation arrows (⇒) onto separate vertical lines
    s = s.replace(/\s*⇒\s*/g, '\n⇒ ');
    // Break explicit <br>
    s = s.replace(/<br\s*\/?>/gi, '\n');
    return s.split('\n').map(l => l.trim()).filter(Boolean).map(l => `<div class="sol-step">${l}</div>`).join('');
  }

  function oscWavePath(ratio) {
    const maxW = Math.max(20, Math.round(ratio * 600));
    let d = 'M 0 8';
    for (let x = 0; x <= maxW; x += 6) {
      d += ` L ${x} ${(8 + Math.sin(x * 0.09) * 4.5).toFixed(1)}`;
    }
    return d;
  }

  function renderMapInnerHtml(st, isMobile = false) {
    const queue = st.queue;
    const isExamRunning = st.studyMode === 'exam' && !st.examSubmitted;
    const wrongN = getWrongQuestions().length;
    const navDots = queue.map((item, idx) => {
      const ig = gradeQuestion(item, st.answers[item.id]);
      let cls = 'nav-dot';
      if (idx === st.index) cls += ' current';
      if ((st.studyMode === 'practice' && st.checked[item.id]) || st.examSubmitted) {
        if (ig.done) cls += ig.ok ? ' right' : ' wrong';
      } else if (ig.done) {
        cls += ' done';
      }
      const onJump = isMobile ? `ExamEngine.jump(${idx});AppStore.toggleMapSheet(false)` : `ExamEngine.jump(${idx})`;
      return `<button type="button" class="${cls}" onclick="${onJump}">${item.id}</button>`;
    }).join('');

    const headHtml = isMobile
      ? `<div class="mob-sheet-head">
          <strong style="font-family:var(--font-display);font-size:15px">Bản đồ câu hỏi (${st.index + 1}/${queue.length})</strong>
          <button type="button" class="inst-btn" style="height:30px;padding:0 10px;font-size:12px" onclick="AppStore.toggleMapSheet(false)">Đóng ✕</button>
        </div>`
      : `<div style="display:flex;justify-content:space-between;align-items:center">
          <span class="rail-section-label" style="margin:0">Bản đồ câu hỏi</span>
          <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted)">${st.index + 1}/${queue.length}</span>
        </div>`;

    return `${headHtml}
      <div class="nav-grid">${navDots}</div>
      ${isExamRunning ? `<button type="button" class="primary-btn" style="width:100%;margin-top:14px;justify-content:center" onclick="ExamEngine.submitExam()">Nộp bài &amp; Chấm điểm</button>` : ''}
      <button type="button" class="inst-btn ${wrongN > 0 ? 'is-amber' : ''}" style="width:100%;margin-top:10px;justify-content:center;${wrongN === 0 ? 'opacity:0.55;cursor:not-allowed' : ''}" ${wrongN === 0 ? 'disabled' : ''} onclick="ExamEngine.retryWrong()">↺ Làm lại những câu sai (${wrongN})</button>
      <button type="button" class="inst-btn" style="width:100%;margin-top:8px;justify-content:center" onclick="ExamEngine.resetSession()">Làm lại phiên này</button>`;
  }

  function renderArena(st) {
    const queue = st.queue;
    const q = queue[st.index] || queue[0];
    const chObj = CHAPTERS.find(c => String(c.id) === String(st.chapter)) || CHAPTERS.find(c => c.id === q.ch) || CHAPTERS[0];
    const ratio = (st.index + 1) / queue.length;
    const isExamRunning = st.studyMode === 'exam' && !st.examSubmitted;
    const showResult = (st.studyMode === 'practice' && st.checked[q.id]) || st.examSubmitted;

    const ans = st.answers[q.id];
    const g = gradeQuestion(q, ans);

    let inputHtml = '';
    if (q.type === 'mcq') {
      const keys = ['A', 'B', 'C', 'D'];
      inputHtml = `<div class="options-stack">${q.options.map((opt, idx) => {
        let cls = 'opt-btn';
        if (showResult) {
          if (idx === q.answer) cls += ' correct';
          else if (idx === ans) cls += ' wrong';
        } else if (idx === ans) {
          cls += ' selected';
        }
        return `<button type="button" class="${cls}" style="--i:${idx}" onclick="ExamEngine.pickMcq(${q.id}, ${idx})">
          <span class="opt-key">${keys[idx]}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')}</div>`;
    } else if (q.type === 'tf') {
      const curArr = Array.isArray(ans) ? ans : [null, null, null, null];
      const letters = ['a', 'b', 'c', 'd'];
      inputHtml = `<div class="tf-list">${q.statements.map((stmt, i) => {
        let rowCls = 'tf-row';
        if (showResult) rowCls += curArr[i] === q.answer[i] ? ' row-ok' : ' row-err';
        return `<div class="${rowCls}">
          <div class="tf-text"><b>${letters[i]})</b> ${stmt}</div>
          <div class="tf-actions">
            <button type="button" class="tf-toggle ${curArr[i] === true ? 'active' : ''}" aria-pressed="${curArr[i] === true}" ${showResult ? 'disabled' : ''} onclick="ExamEngine.pickTf(${q.id}, ${i}, true)">Đúng</button>
            <button type="button" class="tf-toggle ${curArr[i] === false ? 'active' : ''}" aria-pressed="${curArr[i] === false}" ${showResult ? 'disabled' : ''} onclick="ExamEngine.pickTf(${q.id}, ${i}, false)">Sai</button>
          </div>
        </div>`;
      }).join('')}</div>
      ${!isExamRunning && !showResult ? `<div style="margin-top:12px"><button type="button" class="primary-btn" onclick="ExamEngine.checkTf(${q.id})">Kiểm tra 4 ý Đ/S</button></div>` : ''}`;
    } else {
      const valStr = ans !== undefined && ans !== null ? String(ans) : '';
      let inpCls = 'short-input';
      if (showResult) inpCls += g.ok ? ' is-ok' : ' is-err';
      inputHtml = `<div class="short-input-wrap">
        <input type="text" id="shortAnsInput" class="${inpCls}" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="Nhập số (vd: 0,5)" value="${valStr.replace(/"/g, '&quot;')}" ${showResult ? 'disabled' : ''}
          oninput="ExamEngine.typeShort(${q.id}, this.value)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();ExamEngine.enterShort(${q.id});}" />
        <span style="font-family:var(--font-mono);color:var(--ink-muted)">${q.unit || ''}</span>
        ${!isExamRunning && !showResult ? `<button type="button" class="primary-btn" onclick="ExamEngine.checkShort(${q.id})">Chấm đáp án</button>` : ''}
      </div>`;
    }

    let solutionHtml = '';
    if (showResult) {
      const verdict = q.type === 'tf'
        ? `Đúng ${g.right || 0}/4 ý (${g.score} điểm)`
        : (g.ok ? 'CHÍNH XÁC' : `CHƯA ĐÚNG · ĐÁP ÁN: ${q.type === 'mcq' ? ['A', 'B', 'C', 'D'][q.answer] : String(q.answer).replace('.', ',') + ' ' + (q.unit || '')}`);
      const formattedExp = formatSolutionHtml(q.exp);
      const solNextBtn = st.index < queue.length - 1
        ? `<button type="button" class="primary-btn" style="height:32px;padding:0 12px;font-size:12.5px" onclick="ExamEngine.jump(${st.index + 1})">Câu tiếp →</button>`
        : `<button type="button" class="primary-btn" style="height:32px;padding:0 12px;font-size:12.5px" onclick="AppStore.backToLobby()">← Về Chủ đề</button>`;
      solutionHtml = `<div class="solution-box ${g.ok ? 'is-right' : 'is-wrong'}" role="status">
        <div class="solution-head">
          <span>${verdict}</span>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">
            <button type="button" class="inst-btn" onclick="AppStore.openModelFromQuestion('${q.model}')">Mở mô hình 3D →</button>
            ${solNextBtn}
          </div>
        </div>
        <div class="sol-steps">${formattedExp}</div>
      </div>`;
    }

    let examSummaryHtml = '';
    if (st.examSubmitted) {
      let totalPts = 0;
      let rightN = 0;
      queue.forEach(item => {
        const r = gradeQuestion(item, st.answers[item.id]);
        totalPts += r.score;
        if (r.ok) rightN++;
      });
      const maxPts = queue.length;
      const pct = Math.round((totalPts / maxPts) * 100);
      const tone = pct >= 80 ? 'var(--emerald)' : pct >= 50 ? 'var(--amber)' : 'var(--crimson)';
      const best = st.bestExam;
      examSummaryHtml = `<div class="exam-summary-banner" role="status">
        <div class="summary-meta">
          <div class="result-ring">
            <svg viewBox="0 0 104 104" aria-hidden="true"><circle class="ring-track" cx="52" cy="52" r="46"/><circle class="ring-fill" cx="52" cy="52" r="46" style="stroke:${tone};stroke-dashoffset:${(289 * (1 - pct / 100)).toFixed(1)}"/></svg>
            <b style="color:${tone}">${pct}%</b>
          </div>
          <div>
            <div class="stage-eyebrow">Kết quả Thi thử</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:700">${(totalPts / maxPts * 10).toFixed(2).replace('.', ',')} / 10 điểm</div>
            <div class="summary-stats">Đúng hoàn toàn ${rightN}/${maxPts} câu · Điểm quy đổi ${totalPts.toFixed(2)}/${maxPts}${best !== null ? ` · Kỷ lục ${best}%` : ''}</div>
          </div>
        </div>
        <button type="button" class="primary-btn" onclick="ExamEngine.startExam50()">Làm đề mới</button>
      </div>`;
    }

    const wrongN = getWrongQuestions().length;
    const doneInQueue = queue.filter(item => st.checked[item.id]).length;
    const rightInQueue = queue.filter(item => st.checked[item.id] && gradeQuestion(item, st.answers[item.id]).ok).length;
    const topicComplete = !isExamRunning && st.studyMode === 'practice' && queue.length > 0 && doneInQueue === queue.length;
    let topicDoneHtml = '';
    if (topicComplete) {
      const nextCh = Number.isInteger(st.chapter) ? CHAPTERS.find(c => c.id === st.chapter + 1) : null;
      topicDoneHtml = `<div class="topic-done-banner" role="status">
        <div>
          <div class="stage-eyebrow" style="color:var(--emerald)">Hoàn thành chuyên đề</div>
          <strong style="font-size:15px">Đã chấm xong ${doneInQueue}/${queue.length} câu · Đúng ${rightInQueue}/${queue.length} câu</strong>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button type="button" class="primary-btn" onclick="AppStore.backToLobby()">← Về Sảnh chọn bài khác</button>
          ${nextCh ? `<button type="button" class="inst-btn" onclick="AppStore.openChapter(${nextCh.id})">Bài tiếp: ${nextCh.code} →</button>` : ''}
          ${wrongN > 0 ? `<button type="button" class="inst-btn is-amber" onclick="ExamEngine.retryWrong()">↺ Làm lại câu sai (${wrongN})</button>` : ''}
        </div>
      </div>`;
    }

    const typeLabel = q.type === 'mcq' ? 'Nhiều lựa chọn' : q.type === 'tf' ? 'Đúng / Sai (4 ý)' : 'Trả lời ngắn';
    const topicTitle = st.studyMode === 'exam' ? '⚡ Thi thử 40 câu · 50p' : AppStore.getTopicTitle(st.chapter);
    const eyebrowText = st.studyMode === 'exam'
      ? 'Đấu trường Thi thử THPTQG'
      : st.chapter === 'all'
        ? 'Bộ đề tổng hợp 3 dạng'
        : st.chapter === 'wrong'
          ? 'Ôn tập câu làm sai'
          : `${chObj.code} · ${chObj.title}`;
    const leadText = st.studyMode === 'exam'
      ? '40 câu ngẫu nhiên theo cấu trúc chuẩn · Bấm giờ 50 phút & tự động lưu bài làm dở.'
      : st.chapter === 'all'
        ? `${PHYSICS_QUESTIONS.length} câu Chương 2 Khí Lí Tưởng — 5 mục chính, 3 phần bổ sung và Đề cương Lý 12.`
        : st.chapter === 'wrong'
          ? `Làm lại ${queue.length} câu chưa đúng để củng cố kiến thức.`
          : chObj.blurb;

    return `
      <div class="quiz-back-bar">
        <button type="button" class="back-lobby-btn" onclick="AppStore.backToLobby()">← Chủ đề</button>
        <div class="quiz-bar-title">${topicTitle}</div>
        <button type="button" class="inst-btn mob-map-btn" onclick="AppStore.toggleMapSheet(true)">🗺 ${st.index + 1}/${queue.length}</button>
      </div>
      <div class="stage-view observatory-stage quiz-stage">
        <div class="stage-header-band">
          <div>
            <div class="stage-eyebrow">${eyebrowText}</div>
            <h1 class="stage-h1">Đấu trường Trắc nghiệm Vật Lý 12</h1>
            <p class="stage-lead">${leadText}</p>
          </div>
          <div class="arena-toolbar">
            <div class="segmented-control" role="tablist" aria-label="Chế độ làm bài">
              <button type="button" class="seg-item ${st.studyMode === 'practice' ? 'active' : ''}" onclick="ExamEngine.setStudyMode('practice')">Luyện tập</button>
              <button type="button" class="seg-item ${st.studyMode === 'exam' ? 'active' : ''}" onclick="ExamEngine.setStudyMode('exam')">Thi thử 50p</button>
            </div>
            ${isExamRunning ? `<div class="exam-timer-badge" id="liveTimerEl">⏱ 50:00</div>` : ''}
          </div>
        </div>

        ${examSummaryHtml}
        ${topicDoneHtml}

        <div class="arena-layout">
          <article class="arena-sheet ${isExamRunning ? 'exam-live' : ''}">
            <svg class="osc-progress-svg" viewBox="0 0 600 16" preserveAspectRatio="none" aria-hidden="true">
              <line x1="0" y1="8" x2="600" y2="8" stroke="var(--line-hair)" stroke-width="1"/>
              <path d="${oscWavePath(ratio)}" fill="none" stroke="var(--cobalt)" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <div class="q-meta-row">
              <span class="q-index-tag">CÂU ${q.id} (${st.index + 1}/${queue.length})</span>
              <span class="q-type-tag">${typeLabel}</span>
            </div>

            <div class="q-stem">${q.q}</div>
            ${q.summary ? `<div class="q-summary-box"><strong>Tóm tắt đề</strong>${q.summary.replace(/\n/g, '<br>')}</div>` : ''}
            ${q.diagram ? renderQuestionDiagram(q.diagram) : ''}
            ${inputHtml}
            ${solutionHtml}

            <div class="arena-footer">
              <button type="button" class="inst-btn" ${st.index === 0 ? 'disabled' : ''} onclick="ExamEngine.jump(${st.index - 1})">← Câu trước</button>
              <span class="footer-kbd-hint" style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint)">[A–D / 1–4] chọn đáp án · [←/→] hoặc [Enter] qua câu · [Ctrl+K] công thức</span>
              ${st.index < queue.length - 1
                ? `<button type="button" class="primary-btn" onclick="ExamEngine.jump(${st.index + 1})">Câu tiếp theo →</button>`
                : `<button type="button" class="primary-btn" onclick="AppStore.backToLobby()">← Về Chủ đề</button>`}
            </div>
          </article>

          <aside class="nav-panel" id="navPanel">
            ${renderMapInnerHtml(st, false)}
          </aside>
        </div>
      </div>`;
  }

  function recordProgress(q) {
    const g = gradeQuestion(q, AppStore.state.answers[q.id]);
    if (!g.done) return;
    AppStore.state.progress[q.id] = { score: g.score, ok: Boolean(g.ok) };
    AppStore.saveCurrentSession();
  }

  function pickMcq(id, idx) {
    const st = AppStore.state;
    const q = st.queue.find(x => x.id === id);
    if (!q || st.examSubmitted || (st.studyMode === 'practice' && st.checked[id])) return;
    st.answers[id] = idx;
    if (st.studyMode === 'practice') {
      st.checked[id] = true;
      recordProgress(q);
      if (idx === q.answer) AudioBench.correct();
      else AudioBench.wrong();
    } else {
      AudioBench.click();
      AppStore.saveCurrentSession();
    }
    AppStore.renderStage();
  }

  function pickTf(id, stmtIdx, val) {
    const st = AppStore.state;
    if (st.examSubmitted || (st.studyMode === 'practice' && st.checked[id])) return;
    if (!Array.isArray(st.answers[id])) st.answers[id] = [null, null, null, null];
    st.answers[id][stmtIdx] = val;
    AudioBench.click();
    AppStore.saveCurrentSession();
    AppStore.renderStage();
  }

  function checkTf(id) {
    const st = AppStore.state;
    const q = st.queue.find(x => x.id === id);
    if (!q || st.studyMode !== 'practice' || st.checked[id]) return;
    st.checked[id] = true;
    const g = gradeQuestion(q, st.answers[id]);
    recordProgress(q);
    if (g.ok) AudioBench.correct();
    else AudioBench.wrong();
    AppStore.renderStage();
  }

  function typeShort(id, val) {
    AppStore.state.answers[id] = val;
    AppStore.saveCurrentSession();
    AppStore.syncMobileOverlays();
  }

  function checkShort(id) {
    const st = AppStore.state;
    const q = st.queue.find(x => x.id === id);
    if (!q || st.studyMode !== 'practice' || st.checked[id]) return;
    const g = gradeQuestion(q, st.answers[id]);
    if (!g.done) return;
    st.checked[id] = true;
    recordProgress(q);
    if (g.ok) AudioBench.correct();
    else AudioBench.wrong();
    AppStore.renderStage();
  }

  function enterShort(id) {
    const st = AppStore.state;
    const curQ = st.queue[st.index];
    if (!curQ || curQ.id !== id) return;
    if (st.studyMode === 'practice') {
      if (!st.checked[id]) checkShort(id);
      else jump(st.index + 1);
    } else if (st.studyMode === 'exam' && !st.examSubmitted) {
      document.getElementById('shortAnsInput')?.blur();
    }
  }

  function jump(idx) {
    const st = AppStore.state;
    if (idx < 0 || idx >= st.queue.length) return;
    AppStore.toggleMapSheet(false);
    AudioBench.click();
    st.index = idx;
    AppStore.saveCurrentSession();
    AppStore.renderStage();
    const sheet = document.querySelector('.arena-sheet');
    if (sheet) {
      const rect = sheet.getBoundingClientRect();
      if (window.innerWidth <= 980 || rect.top < 52) {
        const targetY = Math.max(0, window.scrollY + rect.top - 56);
        if (Math.abs(window.scrollY - targetY) > 24) {
          window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
      }
    }
  }

  function setStudyMode(mode) {
    const st = AppStore.state;
    if (mode === st.studyMode) return;
    if (mode === 'exam') {
      startExam50();
    } else {
      stopTimer();
      st.studyMode = 'practice';
      st.examSubmitted = false;
      AppStore.openChapter(st.chapter && st.chapter !== 'all' ? st.chapter : 1, { fromRestore: true, silent: true });
    }
  }

  function startExam50() {
    const st = AppStore.state;
    AppStore.toggleMapSheet(false);
    AudioBench.click();
    const pool = shuffle([...PHYSICS_QUESTIONS]).slice(0, 40);
    st.queue = pool;
    st.chapter = 'all';
    st.view = 'quiz';
    st.studyMode = 'exam';
    st.examSubmitted = false;
    st.answers = {};
    st.checked = {};
    st.index = 0;
    st.examEndAt = Date.now() + 50 * 60 * 1000;
    if (window.history && window.history.pushState) {
      try { window.history.pushState({ vatlyView: 'quiz' }, ''); } catch (_) {}
    }
    stopTimer();
    st.examTimerId = setInterval(tickTimer, 1000);
    AppStore.saveCurrentSession();
    AppStore.renderStage();
    tickTimer();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function resumeDraft(opts = {}) {
    const st = AppStore.state;
    const draft = st.examDraft;
    if (!draft || !Array.isArray(draft.queueIds) || draft.endAt <= Date.now()) {
      st.examDraft = null;
      AppStore.save();
      if (opts.fromRestore) AppStore.backToLobby(true);
      else startExam50();
      return;
    }
    const byId = new Map(PHYSICS_QUESTIONS.map(q => [q.id, q]));
    const pool = draft.queueIds.map(id => byId.get(id)).filter(Boolean);
    if (!pool.length) {
      st.examDraft = null;
      AppStore.save();
      if (opts.fromRestore) AppStore.backToLobby(true);
      else startExam50();
      return;
    }
    AppStore.toggleMapSheet(false);
    if (!opts.fromRestore) AudioBench.click();
    st.queue = pool;
    st.chapter = 'all';
    st.view = 'quiz';
    st.studyMode = 'exam';
    st.examSubmitted = false;
    st.answers = draft.answers ? { ...draft.answers } : {};
    st.checked = {};
    st.index = Math.min(draft.index || 0, pool.length - 1);
    st.examEndAt = draft.endAt;
    if (!opts.fromRestore && window.history && window.history.pushState) {
      try { window.history.pushState({ vatlyView: 'quiz' }, ''); } catch (_) {}
    }
    stopTimer();
    st.examTimerId = setInterval(tickTimer, 1000);
    AppStore.saveCurrentSession();
    AppStore.renderStage();
    tickTimer();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function tickTimer() {
    const st = AppStore.state;
    const el = document.getElementById('liveTimerEl');
    if (st.studyMode !== 'exam' || st.examSubmitted) return;
    const rem = Math.max(0, Math.floor((st.examEndAt - Date.now()) / 1000));
    const mm = String(Math.floor(rem / 60)).padStart(2, '0');
    const ss = String(rem % 60).padStart(2, '0');
    if (el) {
      el.textContent = `⏱ ${mm}:${ss}`;
      el.classList.toggle('is-low', rem <= 300);
    }
    if (rem === 0) submitExam();
  }

  function stopTimer() {
    if (AppStore.state.examTimerId) {
      clearInterval(AppStore.state.examTimerId);
      AppStore.state.examTimerId = null;
    }
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function submitExam() {
    const st = AppStore.state;
    if (st.examSubmitted) return;
    AppStore.toggleMapSheet(false);
    stopTimer();
    st.examSubmitted = true;
    let total = 0;
    let rightN = 0;
    st.queue.forEach(q => {
      const g = gradeQuestion(q, st.answers[q.id]);
      total += g.score;
      if (g.ok) rightN++;
      if (g.done) st.progress[q.id] = { score: g.score, ok: Boolean(g.ok) };
    });
    const pct = Math.round(total / st.queue.length * 100);
    const score10 = (total / st.queue.length * 10).toFixed(2).replace('.', ',');
    if (st.bestExam === null || pct > st.bestExam) st.bestExam = pct;
    st.examDraft = null;
    st.examHistory = [{ ts: Date.now(), rightN, total: st.queue.length, score10, pct }, ...(st.examHistory || [])].slice(0, 15);
    AppStore.saveCurrentSession();
    if (pct >= 50) AudioBench.correct(); else AudioBench.wrong();
    AppStore.renderStage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function getWrongQuestions() {
    const st = AppStore.state;
    const inChapter = q => st.chapter === 'all' || st.chapter === 'wrong' || q.ch === st.chapter;
    const sessionWrong = st.queue.filter(q => {
      const graded = (st.studyMode === 'practice' && st.checked[q.id]) || st.examSubmitted;
      return inChapter(q) && graded && !gradeQuestion(q, st.answers[q.id]).ok;
    });
    if (sessionWrong.length > 0) return sessionWrong;
    return PHYSICS_QUESTIONS.filter(q => inChapter(q) && st.progress[q.id]?.ok === false);
  }

  function retryWrong() {
    const st = AppStore.state;
    const wrongList = getWrongQuestions();
    AppStore.toggleMapSheet(false);
    AudioBench.click();
    if (!wrongList.length) return;
    stopTimer();
    wrongList.forEach(q => {
      delete st.answers[q.id];
      delete st.checked[q.id];
    });
    st.chapter = 'wrong';
    st.queue = wrongList;
    st.studyMode = 'practice';
    st.examSubmitted = false;
    st.view = 'quiz';
    st.index = 0;
    AppStore.saveCurrentSession();
    AppStore.renderStage();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function resetSession() {
    const st = AppStore.state;
    AppStore.toggleMapSheet(false);
    if (st.studyMode === 'exam') {
      startExam50();
      return;
    }
    AppStore.resetTopic(st.chapter);
  }

  return {
    gradeQuestion,
    renderMapInnerHtml,
    renderArena,
    pickMcq,
    pickTf,
    checkTf,
    typeShort,
    checkShort,
    enterShort,
    jump,
    setStudyMode,
    startExam50,
    resumeDraft,
    submitExam,
    stopTimer,
    retryWrong,
    resetSession
  };
})();

// ============================================================================
// 8. FORMULA & SI CONSTANTS DRAWER + KEYBOARD / MOBILE TOUCH NAVIGATION
// ============================================================================
const DrawerModal = (() => {
  function renderList(query = '') {
    const box = document.getElementById('formulaListContainer');
    if (!box) return;
    const q = query.trim().toLowerCase();
    const list = FORMULAS_REF.filter(f =>
      !q || f.name.toLowerCase().includes(q) || f.eq.toLowerCase().includes(q) || f.note.toLowerCase().includes(q)
    );
    box.innerHTML = list.map(f => `
      <div class="formula-entry">
        <div class="formula-name">${f.name}</div>
        <div class="formula-eq">${f.eq}</div>
        <div class="formula-note">${f.note}</div>
      </div>
    `).join('') || '<div style="color:var(--ink-muted);font-size:13px;padding:12px 0">Không tìm thấy công thức phù hợp.</div>';
  }

  function toggle(force) {
    const back = document.getElementById('drawerBackdrop');
    if (!back) return;
    const open = force !== undefined ? force : !back.classList.contains('open');
    if (open) AppStore.toggleMapSheet(false);
    back.classList.toggle('open', open);
    if (open) {
      renderList('');
      const inp = document.getElementById('formulaSearchInput');
      if (inp) { inp.value = ''; setTimeout(() => inp.focus(), 50); }
    }
  }

  return { toggle, filter: renderList };
})();

window.addEventListener('popstate', () => {
  if (AppStore.state.view !== 'lobby') AppStore.backToLobby(true);
});

document.addEventListener('keydown', e => {
  const drawerOpen = document.getElementById('drawerBackdrop')?.classList.contains('open');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    DrawerModal.toggle();
  } else if (e.key === 'Escape') {
    DrawerModal.toggle(false);
    AppStore.toggleMapSheet(false);
  } else if (!drawerOpen && AppStore.state.view === 'quiz') {
    const activeEl = document.activeElement;
    const inText = activeEl && ['INPUT', 'TEXTAREA'].includes(activeEl.tagName);
    if (e.key === 'Enter') {
      const curQ = AppStore.state.queue[AppStore.state.index];
      const isShortUnchecked = inText && activeEl.id === 'shortAnsInput' && curQ && !AppStore.state.checked[curQ.id];
      if (!isShortUnchecked) {
        e.preventDefault();
        ExamEngine.jump(AppStore.state.index + 1);
      }
    } else if (!inText) {
      const curQ = AppStore.state.queue[AppStore.state.index];
      const optIdx = 'abcd1234'.indexOf(e.key.toLowerCase());
      if (e.key === 'ArrowRight') ExamEngine.jump(AppStore.state.index + 1);
      else if (e.key === 'ArrowLeft') ExamEngine.jump(AppStore.state.index - 1);
      else if (optIdx >= 0 && !e.ctrlKey && !e.metaKey && !e.altKey && curQ && curQ.type === 'mcq') ExamEngine.pickMcq(curQ.id, optIdx % 4);
    }
  }
});

document.addEventListener('focusin', e => {
  if (window.innerWidth <= 980 && e.target && ['INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'range') {
    document.body.classList.add('kbd-open');
  }
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const ae = document.activeElement;
    const stayOpen = ae && ['INPUT', 'TEXTAREA'].includes(ae.tagName) && ae.type !== 'range';
    if (!stayOpen) document.body.classList.remove('kbd-open');
  }, 60);
});

(() => {
  const stage = document.getElementById('mainStage');
  if (!stage) return;
  let sx = 0, sy = 0, swiping = false;
  stage.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || AppStore.state.view !== 'quiz') { swiping = false; return; }
    if (e.target.closest?.('input, textarea, canvas, svg, .model-pill-strip, .nav-grid')) { swiping = false; return; }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    swiping = true;
  }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (!swiping || !e.changedTouches.length) return;
    swiping = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) >= 68 && Math.abs(dx) > Math.abs(dy) * 1.85) {
      if (dx < 0) ExamEngine.jump(AppStore.state.index + 1);
      else ExamEngine.jump(AppStore.state.index - 1);
    }
  }, { passive: true });
})();

// Spotlight: panels follow the pointer
let spotRaf = 0;
document.addEventListener('pointermove', e => {
  const panel = e.target.closest?.('.arena-sheet, .inspector-panel');
  if (!panel || spotRaf) return;
  spotRaf = requestAnimationFrame(() => {
    spotRaf = 0;
    const r = panel.getBoundingClientRect();
    panel.style.setProperty('--mx', `${e.clientX - r.left}px`);
    panel.style.setProperty('--my', `${e.clientY - r.top}px`);
  });
}, { passive: true });

// Boot Observatory
AppStore.boot();
</script>
